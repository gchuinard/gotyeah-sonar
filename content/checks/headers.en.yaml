# HTTP security headers — EN presentation catalogue.
# `title` / `detail` / `recommendation` mirror the historical text EXACTLY
# (anti-regression guard: tests/test_regression_fr.py). The rest (explanation, why,
# steps, stacks, ai_prompt, refs) is the remediation content GTmetrix-style.
# Placeholders: {items} (permissive CSP), {maxage} (HSTS). {stack} is filled in by the UI.

hdr-csp:
  absent:
    title: "Content-Security-Policy missing"
    detail: "No CSP is sent: the first line of defence against XSS and content injection is missing."
    recommendation: "Define a CSP, even a restrictive one at first (`default-src 'self'`), then refine it."
    explanation: "The Content-Security-Policy is an allowlist that the browser enforces: it declares where code, styles, images and connections are allowed to come from. Anything not explicitly allowed is blocked."
    why: "Without a CSP, an XSS flaw is exploited with no safeguard whatsoever: an injected script runs, exfiltrates cookies/sessions and pivots to the API. A CSP turns a critical XSS into a blocked attempt."
    steps:
      - "Start in observation mode with `Content-Security-Policy-Report-Only` to spot what would break, without blocking anything."
      - "Set a strict baseline: `default-src 'self'`, then add ONLY the origins actually used (CDN, analytics, fonts)."
      - "Ban `unsafe-inline`/`unsafe-eval`: move to nonces (`'nonce-...'`) or hashes for your inline scripts/styles."
      - "Once no violations are reported, switch the header to `Content-Security-Policy` (blocking mode)."
    stacks:
      nginx: "add_header Content-Security-Policy \"default-src 'self'; object-src 'none'; base-uri 'self'\" always;"
      npm: "Proxy Host → Advanced → Custom Nginx Configuration: add_header Content-Security-Policy \"default-src 'self'\" always;"
      cloudflare: "Rules → Transform Rules → Modify Response Header → Set static: Content-Security-Policy = default-src 'self'"
      apache: "Header always set Content-Security-Policy \"default-src 'self'; object-src 'none'\""
      nextjs: "next.config.js → headers(): { key: 'Content-Security-Policy', value: \"default-src 'self'\" }"
    ai_prompt: "You are a web security expert. The site {host} (served by {stack}) sends no Content-Security-Policy header. Propose a strict yet functional CSP starting from `default-src 'self'`, explain how to deploy it first in Report-Only mode then in blocking mode, and show the exact configuration for {stack}. Do not invent origins: leave placeholders to fill in for third-party domains."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy"
      - "https://content-security-policy.com/"
    a_verifier: false
  weak:
    title: "CSP present but permissive"
    detail: "The CSP allows {items}, which greatly weakens its protection."
    recommendation: "Remove these directives by moving to nonces/hashes for your scripts."
    explanation: "`unsafe-inline` allows JS/CSS written directly in the page and `unsafe-eval` allows `eval()` and friends. But that is precisely what an XSS attack injects: with these directives, the CSP lets through the very attack it is meant to block."
    why: "A CSP that contains `unsafe-inline` gives a false sense of security: an injected script still runs. Real protection only begins once these directives are removed."
    steps:
      - "Identify the page's legitimate inline scripts/styles."
      - "Replace them with external files served from your origin, or tag them with a nonce (`<script nonce=\"...\">`) regenerated on every response."
      - "Remove `unsafe-inline` and `unsafe-eval` from the `script-src`/`style-src` directive."
      - "Re-test in Report-Only mode to confirm no legitimate resource is blocked."
    stacks:
      nginx: "add_header Content-Security-Policy \"default-src 'self'; script-src 'self' 'nonce-$request_id'\" always;"
      cloudflare: "Transform Rules → adjust the Content-Security-Policy value to remove 'unsafe-inline' / 'unsafe-eval'."
      nextjs: "Generate a per-request nonce (middleware) and inject it into the CSP and the <script> tags."
    ai_prompt: "You are a web security expert. The CSP of {host} (served by {stack}) allows {items}. Explain the risk, then show how to migrate to a nonce/hash-based CSP to remove these directives, with the exact configuration for {stack}."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/script-src"
    a_verifier: false
  permissive:
    title: "Wide-open CSP (broad script sources)"
    detail: "The CSP allows scripts from any origin (`*`, `http:`/`https:`, `data:`) or does not restrict scripts at all: it provides no real XSS protection."
    recommendation: "Restrict `script-src` (or `default-src`) to `'self'` and your specific origins; remove `*` and broad schemes."
    explanation: "A CSP is only useful if it actually limits where code may come from. With `script-src *` (or `default-src *`, `https:`, `data:`…), or with no script directive at all, the browser will execute JavaScript from any origin: the CSP is present but wide open."
    why: "This is the classic false negative of a presence-only scan: the CSP exists, the audit believes it protects, but an XSS flaw stays fully exploitable because any script source is allowed. Protection only begins with a strict allowlist."
    steps:
      - "Explicitly define `script-src` (or tighten `default-src`) to `'self'` plus your precise list of trusted origins."
      - "Remove `*`, `http:`, `https:` and `data:` from script sources."
      - "Add `object-src 'none'` and `base-uri 'self'` to close classic bypasses."
      - "Re-test in `Content-Security-Policy-Report-Only` to confirm no legitimate resource is blocked."
    stacks:
      nginx: "add_header Content-Security-Policy \"default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'\" always;"
      npm: "Proxy Host → Advanced → Custom Nginx: add_header Content-Security-Policy \"default-src 'self'; object-src 'none'\" always;"
      cloudflare: "Transform Rules → adjust the Content-Security-Policy value to remove `*`/broad schemes and set `script-src 'self'`."
      apache: "Header always set Content-Security-Policy \"default-src 'self'; script-src 'self'; object-src 'none'\""
      nextjs: "next.config.js → headers(): { key: 'Content-Security-Policy', value: \"default-src 'self'; script-src 'self'; object-src 'none'\" }"
    ai_prompt: "You are a web security expert. The CSP of {host} (served by {stack}) allows scripts from broad sources ({evidence}), which voids its XSS protection. Explain the issue, then give a tightened CSP (`script-src 'self'`, `object-src 'none'`, `base-uri 'self'`) and the exact configuration for {stack}. Do not invent third-party origins."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/script-src"
      - "https://content-security-policy.com/"
    a_verifier: false
  ok:
    title: "Content-Security-Policy present"
    detail: "A CSP is defined, with no notoriously dangerous directive."
    why: "A strict CSP is in place: it is the main defence in depth against XSS and content injection."

hdr-hsts:
  absent:
    title: "HSTS missing"
    detail: "Without HSTS, a visitor can be downgraded to HTTP by a network attacker."
    recommendation: "Add `Strict-Transport-Security: max-age=63072000; includeSubDomains; preload`."
    explanation: "HTTP Strict Transport Security tells the browser to NEVER again contact the site in cleartext: once the header has been seen, all requests go over HTTPS, even if the user types `http://` or clicks an old link."
    why: "Without HSTS, the very first request (or an http:// link) can be intercepted and kept in cleartext by a network attacker (public Wi-Fi, hostile proxy) who then serves a fake site (SSL stripping)."
    steps:
      - "Make sure the WHOLE site is served over valid HTTPS and that http→https already redirects (otherwise HSTS would make the site unreachable)."
      - "Add the header `Strict-Transport-Security: max-age=63072000; includeSubDomains; preload`."
      - "Check that all subdomains are indeed on HTTPS before enabling `includeSubDomains`."
      - "Optional: submit the domain on hstspreload.org to hard-wire it into browsers."
    stacks:
      nginx: "add_header Strict-Transport-Security \"max-age=63072000; includeSubDomains; preload\" always;"
      npm: "Proxy Host → SSL → tick \"HSTS Enabled\" (and \"HSTS Subdomains\" if all your subdomains are on HTTPS)."
      cloudflare: "SSL/TLS → Edge Certificates → HTTP Strict Transport Security (HSTS) → Enable."
      apache: "Header always set Strict-Transport-Security \"max-age=63072000; includeSubDomains; preload\""
    ai_prompt: "You are a web security expert. {host} (served by {stack}) sends no HSTS header. Explain the SSL stripping risk, the prerequisites (HTTPS everywhere, redirection), then give the exact configuration for {stack} with a max-age of 2 years, includeSubDomains and preload."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security"
      - "https://hstspreload.org/"
    a_verifier: false
  disabled:
    title: "HSTS present but disabled (max-age=0)"
    detail: "The Strict-Transport-Security header is sent without a valid `max-age` (missing or =0): HSTS is not enforced, and `max-age=0` even clears a previously stored policy."
    recommendation: "Set a real `max-age`: `Strict-Transport-Security: max-age=63072000; includeSubDomains; preload`."
    explanation: "`max-age` is how long the browser enforces HTTPS. At 0 (or missing), the header is inert: it forces nothing, and `max-age=0` is precisely how HSTS is DISABLED on a client that had already stored it."
    why: "A present HSTS header gives a false sense of security: here it does not protect against SSL stripping, and may even have cleared a prior protection. Cleartext downgrade remains possible."
    steps:
      - "Make sure the whole site is on valid HTTPS and http→https already redirects."
      - "Replace `max-age=0` (or the missing max-age) with `max-age=63072000`."
      - "Add `includeSubDomains` (if all subdomains are on HTTPS) then `preload`."
      - "Verify the header returned after deployment."
    stacks:
      nginx: "add_header Strict-Transport-Security \"max-age=63072000; includeSubDomains; preload\" always;"
      npm: "Proxy Host → SSL → tick « HSTS Enabled » (check no custom config sets max-age=0)."
      cloudflare: "SSL/TLS → Edge Certificates → HSTS → enable with a Max Age of at least 6 months."
      apache: "Header always set Strict-Transport-Security \"max-age=63072000; includeSubDomains; preload\""
    ai_prompt: "You are a web security expert. {host} (served by {stack}) sends an HSTS header without a valid max-age ({evidence}): HSTS is disabled. Explain the risk (and that max-age=0 clears an existing policy), then give the exact configuration for {stack} with max-age=63072000, includeSubDomains and preload."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security"
      - "https://hstspreload.org/"
    a_verifier: false
  ok:
    title: "HSTS present"
    detail: "The Strict-Transport-Security header is sent."
    why: "The browser will force HTTPS for this domain: cleartext downgrade is neutralised."

hdr-hsts-maxage:
  low:
    title: "HSTS max-age too low"
    detail: "max-age={maxage} s, below the recommended threshold (~6 months)."
    recommendation: "Raise max-age to 63072000 (2 years) once your HTTPS is reliable."
    explanation: "The `max-age` is the duration (in seconds) for which the browser keeps the \"HTTPS only\" instruction. Too short, and the protection expires quickly, reopening the downgrade window regularly."
    why: "A low max-age weakens HSTS: if the user does not return before expiry, their next visit can start in cleartext and be intercepted."
    steps:
      - "Confirm that your HTTPS is stable and durable (certificate renewed automatically)."
      - "Increase `max-age` to 63072000 (2 years), the value expected notably for preload."
      - "Keep `includeSubDomains` if all your subdomains are on HTTPS."
    stacks:
      nginx: "add_header Strict-Transport-Security \"max-age=63072000; includeSubDomains; preload\" always;"
      cloudflare: "SSL/TLS → Edge Certificates → HSTS → raise the Max Age to 12 months or more."
    ai_prompt: "You are a web security expert. {host} (served by {stack}) sends HSTS with a max-age of {maxage} seconds, too short. Explain why and give the exact configuration for {stack} with max-age=63072000."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security"
    a_verifier: false

hdr-xfo:
  absent:
    title: "Clickjacking protection missing"
    detail: "Neither X-Frame-Options nor frame-ancestors: the page can be embedded in an iframe."
    recommendation: "Add `X-Frame-Options: DENY` or `frame-ancestors 'none'` in the CSP."
    explanation: "Clickjacking consists of loading your site in an invisible iframe placed over a decoy page: the victim thinks they are clicking on the decoy site but actually acts on yours (a \"confirm\" click, a transfer…)."
    why: "Without anti-framing protection, an attacker can hijack the clicks of an authenticated user to make them perform actions on your site without their knowledge."
    steps:
      - "Decide who is allowed to embed your pages (usually nobody)."
      - "Add `Content-Security-Policy: frame-ancestors 'none'` (recommended, more granular than X-Frame-Options)."
      - "For compatibility with old browsers, also add `X-Frame-Options: DENY`."
      - "If some pages must be embeddable, replace `'none'` with the explicit list of allowed origins."
    stacks:
      nginx: "add_header Content-Security-Policy \"frame-ancestors 'none'\" always; add_header X-Frame-Options \"DENY\" always;"
      npm: "Proxy Host → Advanced → Custom Nginx: add_header X-Frame-Options \"DENY\" always;"
      cloudflare: "Transform Rules → Set static: X-Frame-Options = DENY (and frame-ancestors via the CSP)."
      apache: "Header always set X-Frame-Options \"DENY\""
      nextjs: "next.config.js → headers(): { key: 'X-Frame-Options', value: 'DENY' }"
    ai_prompt: "You are a web security expert. {host} (served by {stack}) does not protect against clickjacking. Explain the risk, then give the exact configuration for {stack} adding `frame-ancestors 'none'` (CSP) and `X-Frame-Options: DENY`."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options"
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/frame-ancestors"
    a_verifier: false
  permissive:
    title: "Clickjacking protection ineffective"
    detail: "An anti-framing value is present but does not protect: `X-Frame-Options: ALLOWALL`/`ALLOW-FROM` (ignored by browsers) or `frame-ancestors` allowing `*`/a broad scheme. The page stays embeddable."
    recommendation: "Use `X-Frame-Options: DENY` (or `SAMEORIGIN`) and/or `frame-ancestors 'none'` (or an explicit list of allowed origins)."
    explanation: "Only certain values actually protect: `DENY`/`SAMEORIGIN` for X-Frame-Options, and a restricted `frame-ancestors` (`'none'`, `'self'`, or an origin list). `ALLOWALL`, `ALLOW-FROM` (deprecated) or `frame-ancestors *` let anyone embed the page."
    why: "The audit might believe clickjacking is blocked because a header is present, but its value has no effect: an attacker embeds your pages in an iframe and hijacks an authenticated user's clicks."
    steps:
      - "Decide who may embed your pages (usually nobody)."
      - "Replace the permissive value with `frame-ancestors 'none'` (CSP) and `X-Frame-Options: DENY`."
      - "If some pages must be embeddable, explicitly list the allowed origins in `frame-ancestors`."
      - "Avoid `X-Frame-Options: ALLOW-FROM` (deprecated): use `frame-ancestors`."
    stacks:
      nginx: "add_header Content-Security-Policy \"frame-ancestors 'none'\" always; add_header X-Frame-Options \"DENY\" always;"
      npm: "Proxy Host → Advanced → Custom Nginx: add_header X-Frame-Options \"DENY\" always;"
      cloudflare: "Transform Rules → Set static: X-Frame-Options = DENY (and `frame-ancestors 'none'` via the CSP)."
      apache: "Header always set X-Frame-Options \"DENY\""
      nextjs: "next.config.js → headers(): { key: 'X-Frame-Options', value: 'DENY' }"
    ai_prompt: "You are a web security expert. {host} (served by {stack}) has ineffective clickjacking protection ({evidence}): an ignored value or too-broad frame-ancestors. Explain why it does not protect, then give the exact configuration for {stack} with `frame-ancestors 'none'` and `X-Frame-Options: DENY`."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options"
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/frame-ancestors"
    a_verifier: false
  ok:
    title: "Clickjacking protection present"
    detail: "X-Frame-Options or CSP frame-ancestors is defined."
    why: "Your pages cannot be embedded in a malicious iframe: clickjacking is blocked."

hdr-nosniff:
  absent:
    title: "X-Content-Type-Options missing"
    detail: "MIME sniffing can turn a harmless upload into an executable script."
    recommendation: "Add `X-Content-Type-Options: nosniff`."
    explanation: "Without `nosniff`, the browser \"guesses\" a file's type from its content rather than its `Content-Type` header. A seemingly harmless uploaded file can then be reinterpreted as HTML/JS and executed."
    why: "MIME sniffing opens the door to XSS via files served with the wrong type: an \"image\" upload containing HTML can be executed by the browser."
    steps:
      - "Add `X-Content-Type-Options: nosniff` on ALL responses (not just the main page)."
      - "Configure it globally on the server/proxy side rather than route by route."
      - "Make sure your files are served with the correct `Content-Type`."
    stacks:
      nginx: "add_header X-Content-Type-Options \"nosniff\" always;"
      npm: "Proxy Host → Advanced → Custom Nginx: add_header X-Content-Type-Options \"nosniff\" always;"
      cloudflare: "Transform Rules → Set static: X-Content-Type-Options = nosniff"
      apache: "Header always set X-Content-Type-Options \"nosniff\""
      nextjs: "next.config.js → headers(): { key: 'X-Content-Type-Options', value: 'nosniff' }"
    ai_prompt: "You are a web security expert. {host} (served by {stack}) does not send `X-Content-Type-Options: nosniff`. Explain MIME sniffing and give the exact configuration for {stack} applying nosniff to all responses."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options"
    a_verifier: false
  ok:
    title: "X-Content-Type-Options: nosniff"
    detail: "The browser will not guess the MIME type."
    why: "The browser respects the declared Content-Type: no reinterpretation of a file as a script."

hdr-referrer:
  absent:
    title: "Referrer-Policy missing"
    detail: "Without a policy, internal URLs can leak to third-party sites."
    recommendation: "Add `Referrer-Policy: strict-origin-when-cross-origin`."
    explanation: "The `Referer` header tells the destination site where the visitor comes from. Without `Referrer-Policy`, the full URL (with any sensitive parameters) can be transmitted to any third-party domain (outbound link, image, script)."
    why: "Internal URLs — tokens, session identifiers in the URL, private paths — can leak to third parties (analytics, CDN, linked sites), with a confidentiality risk."
    steps:
      - "Choose a policy: `strict-origin-when-cross-origin` is a good default (origin only to third parties, full URL internally)."
      - "Add the `Referrer-Policy` header globally on the server/proxy side."
      - "For sensitive outbound links, also add `rel=\"noreferrer\"`."
    stacks:
      nginx: "add_header Referrer-Policy \"strict-origin-when-cross-origin\" always;"
      cloudflare: "Transform Rules → Set static: Referrer-Policy = strict-origin-when-cross-origin"
      apache: "Header always set Referrer-Policy \"strict-origin-when-cross-origin\""
      nextjs: "next.config.js → headers(): { key: 'Referrer-Policy', value: 'strict-origin-when-cross-origin' }"
    ai_prompt: "You are a web security expert. {host} (served by {stack}) does not set a Referrer-Policy. Explain the URL leak risk and give the exact configuration for {stack} with `strict-origin-when-cross-origin`."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Referrer-Policy"
    a_verifier: false
  weak:
    title: "Permissive Referrer-Policy"
    detail: "The defined policy (`unsafe-url`/`no-referrer-when-downgrade`) sends the full URL, including to third parties: it does not protect against URL leakage."
    recommendation: "Replace it with `strict-origin-when-cross-origin` (or stricter)."
    explanation: "`unsafe-url` sends the full URL (path + parameters) to ALL destinations, including cross-origin and in cleartext. `no-referrer-when-downgrade` sends it whenever the encryption level does not drop. Setting the header to these values is equivalent to no protection."
    why: "Internal URLs — tokens, session identifiers in the URL, private paths — leak to third parties (analytics, CDN, outbound links). The header is present but its value voids the expected protection."
    steps:
      - "Choose `strict-origin-when-cross-origin` (good default: origin only to third parties, full URL internally)."
      - "Replace `unsafe-url`/`no-referrer-when-downgrade` with this value at the server/proxy level."
      - "For sensitive outbound links, also add `rel=\"noreferrer\"`."
    stacks:
      nginx: "add_header Referrer-Policy \"strict-origin-when-cross-origin\" always;"
      cloudflare: "Transform Rules → Set static: Referrer-Policy = strict-origin-when-cross-origin"
      apache: "Header always set Referrer-Policy \"strict-origin-when-cross-origin\""
      nextjs: "next.config.js → headers(): { key: 'Referrer-Policy', value: 'strict-origin-when-cross-origin' }"
    ai_prompt: "You are a web security expert. {host} (served by {stack}) sets a permissive Referrer-Policy ({evidence}) that leaks the full URL. Explain the risk and give the exact configuration for {stack} with `strict-origin-when-cross-origin`."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Referrer-Policy"
    a_verifier: false
  ok:
    title: "Referrer-Policy present"
    detail: "The Referer policy is defined."
    why: "The transmission of the origin URL to third parties is governed: no internal URL leak."

hdr-permissions:
  absent:
    title: "Permissions-Policy missing"
    detail: "Optional but recommended to disable unused browser APIs."
    recommendation: "E.g. `Permissions-Policy: camera=(), microphone=(), geolocation=()`."
    explanation: "`Permissions-Policy` declares which powerful browser APIs (camera, microphone, geolocation, payment…) your page — and the iframes it embeds — are allowed to use. Disabling those you do not use reduces the attack surface."
    why: "Without a policy, a third-party iframe or a compromised script can try to access sensitive APIs (camera, microphone, geolocation). It is a low-cost defence in depth."
    steps:
      - "List the browser APIs your site actually uses."
      - "Explicitly disable everything else with an empty value, e.g. `camera=(), microphone=(), geolocation=()`."
      - "Allow an API only for your own origin if needed, e.g. `geolocation=(self)`."
    stacks:
      nginx: "add_header Permissions-Policy \"camera=(), microphone=(), geolocation=()\" always;"
      cloudflare: "Transform Rules → Set static: Permissions-Policy = camera=(), microphone=(), geolocation=()"
      apache: "Header always set Permissions-Policy \"camera=(), microphone=(), geolocation=()\""
      nextjs: "next.config.js → headers(): { key: 'Permissions-Policy', value: 'camera=(), microphone=(), geolocation=()' }"
    ai_prompt: "You are a web security expert. {host} (served by {stack}) does not set a Permissions-Policy. Propose a policy that disables unused browser APIs (camera, microphone, geolocation, payment) and give the exact configuration for {stack}."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy"
    a_verifier: false
  ok:
    title: "Permissions-Policy present"
    detail: "Access to browser APIs (camera, microphone, geolocation…) is governed."
    why: "Sensitive browser APIs are explicitly governed: reduced attack surface."

hdr-disclosure:
  leak:
    title: "Software version exposed"
    detail: "Some headers reveal precise versions, useful for targeting known CVEs."
    recommendation: "Hide or shorten these headers (`proxy_hide_header`, `server_tokens off`…)."
    explanation: "Headers like `Server` or `X-Powered-By` announce the software AND its exact version. This is reconnaissance information handed to the attacker: all they have to do is look up the known CVEs for that version."
    why: "Knowing the precise version of the server/framework lets an attacker directly target the matching public flaws, without trial and error. Hiding these headers slows down reconnaissance."
    steps:
      - "Remove or neutralise the `Server`, `X-Powered-By`, `X-AspNet-Version`, `X-AspNetMvc-Version` headers."
      - "On the origin server, disable version disclosure (`server_tokens off`, `expose_php = Off`…)."
      - "On the reverse proxy, hide the headers sent back by the upstream (`proxy_hide_header`)."
    stacks:
      nginx: "server_tokens off; proxy_hide_header X-Powered-By; more_clear_headers Server; (headers-more module)"
      npm: "Proxy Host → Advanced → Custom Nginx: proxy_hide_header X-Powered-By; proxy_hide_header Server;"
      cloudflare: "Transform Rules → Modify Response Header → Remove: Server / X-Powered-By"
      apache: "ServerTokens Prod ; Header always unset X-Powered-By ; Header always unset Server"
    ai_prompt: "You are a web security expert. {host} (served by {stack}) discloses software versions via its headers ({evidence}). Explain the reconnaissance risk and give the exact configuration for {stack} to hide Server / X-Powered-By and the versions."
    refs:
      - "https://owasp.org/www-project-secure-headers/"
    a_verifier: false
  ok:
    title: "No obvious software version"
    detail: "No header discloses an exploitable version number."
    why: "No exploitable software version is announced: reconnaissance via headers is limited."

hdr-coop:
  absent:
    title: "Cross-Origin-Opener-Policy missing"
    detail: "The `Cross-Origin-Opener-Policy` header is not set: the page may share its browsing context with third-party windows."
    explanation: "COOP isolates your page's browsing context group. With `same-origin`, a window you open (or that opens you) no longer keeps a direct reference to yours (`window.opener` becomes null cross-origin)."
    why: "Without COOP, cross-window attacks become possible: cross-origin data leaks (XS-Leaks), `window.opener` abuse, tabnabbing. COOP is also a prerequisite for cross-origin isolation (SharedArrayBuffer, high-resolution timers)."
    steps:
      - "Add `Cross-Origin-Opener-Policy: same-origin` to your pages."
      - "If you must interact with cross-origin popups (payment, OAuth popup), use `same-origin-allow-popups`."
      - "Make sure no legitimate integration (windows opened via window.open) breaks after enabling it."
    stacks:
      nginx: "add_header Cross-Origin-Opener-Policy \"same-origin\" always;"
      apache: "Header always set Cross-Origin-Opener-Policy \"same-origin\""
      npm: "Proxy Host → Advanced → Custom Nginx: add_header Cross-Origin-Opener-Policy \"same-origin\" always;"
      cloudflare: "Transform Rules → Set static: Cross-Origin-Opener-Policy = same-origin"
      nextjs: "next.config.js → headers(): { key: 'Cross-Origin-Opener-Policy', value: 'same-origin' }"
    ai_prompt: "You are a web security expert. {host} (served by {stack}) does not set Cross-Origin-Opener-Policy. Explain the risk (XS-Leaks, window.opener, tabnabbing) and give the exact configuration for {stack} with `same-origin` (or `same-origin-allow-popups` if cross-origin popups are needed)."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cross-Origin-Opener-Policy"
    a_verifier: false
  weak:
    title: "Cross-Origin-Opener-Policy ineffective (unsafe-none)"
    detail: "COOP is set to `unsafe-none`, its no-op value: the page still shares its browsing context with third-party windows, as if the header were absent."
    recommendation: "Switch to `Cross-Origin-Opener-Policy: same-origin` (or `same-origin-allow-popups` if you open cross-origin popups)."
    explanation: "`unsafe-none` is the default value, which isolates nothing: `window.opener` remains accessible cross-origin. Explicitly setting the header to `unsafe-none` does not change the absence of protection."
    why: "Without real isolation, cross-window attacks remain possible (XS-Leaks, `window.opener` abuse, tabnabbing), and cross-origin isolation (SharedArrayBuffer…) is unreachable. The present header gives a false sense of protection."
    steps:
      - "Replace `unsafe-none` with `Cross-Origin-Opener-Policy: same-origin`."
      - "If you must interact with cross-origin popups (payment, OAuth in a popup), use `same-origin-allow-popups`."
      - "Verify no legitimate integration breaks after enabling."
    stacks:
      nginx: "add_header Cross-Origin-Opener-Policy \"same-origin\" always;"
      apache: "Header always set Cross-Origin-Opener-Policy \"same-origin\""
      npm: "Proxy Host → Advanced → Custom Nginx: add_header Cross-Origin-Opener-Policy \"same-origin\" always;"
      cloudflare: "Transform Rules → Set static: Cross-Origin-Opener-Policy = same-origin"
      nextjs: "next.config.js → headers(): { key: 'Cross-Origin-Opener-Policy', value: 'same-origin' }"
    ai_prompt: "You are a web security expert. {host} (served by {stack}) sets Cross-Origin-Opener-Policy to `unsafe-none`, which isolates nothing. Explain the risk (XS-Leaks, window.opener, tabnabbing) and give the exact configuration for {stack} with `same-origin`."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cross-Origin-Opener-Policy"
    a_verifier: false
  ok:
    title: "Cross-Origin-Opener-Policy present"
    detail: "The Cross-Origin-Opener-Policy header is set."
    why: "The browsing context is isolated from third-party windows: no window.opener abuse or cross-window leak."

hdr-coep:
  absent:
    title: "Cross-Origin-Embedder-Policy missing"
    detail: "The `Cross-Origin-Embedder-Policy` header is not set. Optional, but required for cross-origin isolation (SharedArrayBuffer, high-resolution measurements)."
    explanation: "COEP requires every cross-origin resource loaded by the page to explicitly opt in (via CORP or CORS). Combined with COOP, it enables “cross-origin isolation”, which unlocks certain powerful APIs."
    why: "The absence of COEP is not a flaw in itself: it is mainly a missing prerequisite if you need cross-origin isolation. Only enable it when needed, since `require-corp` can break unprepared third-party resources."
    steps:
      - "Only enable COEP if you need cross-origin isolation (otherwise leave it as is)."
      - "Add `Cross-Origin-Embedder-Policy: require-corp` and make sure every cross-origin resource returns `Cross-Origin-Resource-Policy` or adequate CORS headers."
      - "Test carefully: a non-compliant third-party resource will be blocked."
    stacks:
      nginx: "add_header Cross-Origin-Embedder-Policy \"require-corp\" always;"
      apache: "Header always set Cross-Origin-Embedder-Policy \"require-corp\""
      cloudflare: "Transform Rules → Set static: Cross-Origin-Embedder-Policy = require-corp"
      nextjs: "next.config.js → headers(): { key: 'Cross-Origin-Embedder-Policy', value: 'require-corp' }"
    ai_prompt: "You are a web security expert. {host} (served by {stack}) does not send Cross-Origin-Embedder-Policy. Explain what cross-origin isolation is for and its prerequisites, and give the exact configuration for {stack} if it is needed — warning about third-party resources that might break."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cross-Origin-Embedder-Policy"
    a_verifier: false
  ok:
    title: "Cross-Origin-Embedder-Policy present"
    detail: "The Cross-Origin-Embedder-Policy header is set."
    why: "Cross-origin resources must explicitly opt in to being loaded: cross-origin isolation is in place."

hdr-corp:
  absent:
    title: "Cross-Origin-Resource-Policy missing"
    detail: "The `Cross-Origin-Resource-Policy` header is not set: your resources can be loaded by any cross-origin site."
    explanation: "CORP declares who is allowed to embed a resource (image, script, etc.). With `same-origin`, only your origin can load it; with `same-site`, only your site. It is a defense against side-channel attacks (Spectre) and resource theft."
    why: "Without CORP, a sensitive resource (private avatar, document) can be loaded and exploited by a third-party site via side-channel leaks. It is a defense in depth, especially for non-public resources."
    steps:
      - "Add `Cross-Origin-Resource-Policy: same-origin` (or `same-site`) on resources you do not want embedded elsewhere."
      - "For genuinely public resources (CDN, fonts), use `cross-origin` knowingly."
    stacks:
      nginx: "add_header Cross-Origin-Resource-Policy \"same-origin\" always;"
      apache: "Header always set Cross-Origin-Resource-Policy \"same-origin\""
      cloudflare: "Transform Rules → Set static: Cross-Origin-Resource-Policy = same-origin"
      nextjs: "next.config.js → headers(): { key: 'Cross-Origin-Resource-Policy', value: 'same-origin' }"
    ai_prompt: "You are a web security expert. {host} (served by {stack}) does not send Cross-Origin-Resource-Policy. Explain the risk (resource theft, Spectre) and give the exact configuration for {stack} with `same-origin`, distinguishing public resources that must stay `cross-origin`."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cross-Origin-Resource-Policy"
    a_verifier: false
  ok:
    title: "Cross-Origin-Resource-Policy present"
    detail: "The Cross-Origin-Resource-Policy header is set."
    why: "Cross-origin embedding of your resources is restricted: defense in depth against resource theft and Spectre."

hdr-cache:
  sensitive-cacheable:
    title: "Sensitive response potentially cached"
    detail: "The response sets a cookie but does not explicitly forbid caching ({evidence}): an intermediate cache or the browser could store authenticated content."
    explanation: "A response that sets a cookie is usually authenticated/personalized. Without `Cache-Control: no-store` (or `private`/`no-cache`), a shared cache (proxy, CDN) or the browser disk may keep this sensitive page and serve it to another user or after logout."
    why: "Cached authenticated content can leak to another user of a shared machine, or via a poorly partitioned intermediate cache. It is a classic cause of personal-data leakage."
    steps:
      - "On authenticated/personalized responses, send `Cache-Control: no-store` (the strictest)."
      - "Failing that, `Cache-Control: private, no-cache` prevents shared caching and forces revalidation."
      - "Reserve long caches (`public, max-age=...`) for genuinely public, non-personalized resources."
    stacks:
      nginx: "For authenticated routes: add_header Cache-Control \"no-store\" always;"
      apache: "<LocationMatch \"^/(account|admin)\"> Header always set Cache-Control \"no-store\" </LocationMatch>"
      nextjs: "In the authenticated handler/route: header `Cache-Control: no-store` (or `export const dynamic = 'force-dynamic'`)."
      express: "res.set('Cache-Control', 'no-store') on authenticated routes."
    ai_prompt: "You are a web security expert. On {host} (served by {stack}), a response that sets a cookie does not forbid caching. Explain the risk of leaking authenticated content, then show how to send `Cache-Control: no-store` on authenticated responses for {stack}, while keeping long caching for public resources."
    refs:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control"
    a_verifier: false
  ok:
    title: "Sensitive responses not cached"
    detail: "The cookie-setting response forbids caching (`no-store`/`private`/`no-cache`)."
    why: "Authenticated content cannot be stored by a shared cache or the browser: no leakage through the cache."
  not-applicable:
    title: "No sensitive response to protect from caching"
    detail: "The response does not set a cookie: caching it is not a confidentiality risk here."
    why: "A public, non-personalized response can be cached without any leakage risk."
