exposed-compose:
  found:
    title: "Fichier sensible exposé : `{path}`"
    detail: "Un fichier `docker-compose.yml` est accessible : il révèle l'architecture des services, des ports internes et parfois des variables sensibles."
    recommendation: "Retire ce fichier du webroot ; il n'a rien à faire en ligne."
    explanation: "Un `docker-compose.yml` décrit toute l'infrastructure conteneurisée : services, images, ports internes, volumes et — fréquemment — des variables d'environnement avec mots de passe ou clés en clair. C'est un fichier de déploiement qui n'a aucune raison d'être servi en HTTP."
    why: "Lire ce fichier offre à l'attaquant une carte de l'architecture (services internes, ports, dépendances) et parfois directement des secrets : c'est de la reconnaissance de très haute valeur, voire une compromission immédiate."
    steps:
      - "Retire `{path}` du webroot : ce fichier de déploiement ne doit pas être servi."
      - "Bloque par précaution les fichiers `.yml`/`.yaml` à la racine côté serveur."
      - "Si des secrets y figuraient en clair, considère-les comme compromis et régénère-les."
      - "Vérifie que `curl https://{host}/{path}` renvoie 403/404."
    stacks:
      nginx: "location ~* /(docker-compose\\.ya?ml|\\.env)$ { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx : location ~* /docker-compose\\.ya?ml$ { deny all; return 404; }"
      apache: "<FilesMatch \"docker-compose\\.ya?ml$\"> Require all denied </FilesMatch>"
      cloudflare: "WAF → Custom rules → Block : (http.request.uri.path contains \"docker-compose.yml\")"
    ai_prompt: "Tu es un expert en sécurité web. Le site {host} (servi par {stack}) expose `{path}`, qui révèle l'architecture des services et parfois des secrets. Explique le risque, donne la configuration exacte pour {stack} qui bloque ce fichier, et rappelle qu'un fichier de déploiement ne doit jamais être servi en HTTP."
    refs:
      - "https://cwe.mitre.org/data/definitions/538.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    a_verifier: false

exposed-dockerfile:
  found:
    title: "Fichier sensible exposé : `{path}`"
    detail: "Un `Dockerfile` est accessible : il expose la chaîne de build, les versions et parfois des secrets passés en argument."
    recommendation: "Retire ce fichier du webroot."
    explanation: "Un `Dockerfile` décrit comment l'image applicative est construite : image de base et sa version, paquets installés, étapes de build et arguments. Il peut révéler des versions vulnérables et, quand des secrets sont passés en `ARG`/`ENV`, les exposer directement."
    why: "Connaître la chaîne de build et les versions exactes aide l'attaquant à cibler des CVE connues ; et tout secret laissé dans le `Dockerfile` (token, mot de passe) devient directement exploitable."
    steps:
      - "Retire `{path}` du webroot : ce fichier de build n'a pas à être servi."
      - "Vérifie qu'aucun secret n'est passé en `ARG`/`ENV` dans le Dockerfile (utilise des secrets de build dédiés)."
      - "Bloque par précaution `Dockerfile` à la racine côté serveur."
      - "Vérifie que `curl https://{host}/{path}` renvoie 403/404."
    stacks:
      nginx: "location ~* /Dockerfile { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx : location ~* /Dockerfile { deny all; return 404; }"
      apache: "<FilesMatch \"^Dockerfile\"> Require all denied </FilesMatch>"
      cloudflare: "WAF → Custom rules → Block : (http.request.uri.path contains \"/Dockerfile\")"
    ai_prompt: "Tu es un expert en sécurité web. Le site {host} (servi par {stack}) expose `{path}`, qui révèle la chaîne de build et parfois des secrets. Explique le risque, donne la configuration exacte pour {stack} qui bloque ce fichier, et rappelle qu'un secret ne doit jamais figurer en clair dans un Dockerfile."
    refs:
      - "https://cwe.mitre.org/data/definitions/538.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    a_verifier: false

exposed-backup-zip:
  found:
    title: "Fichier sensible exposé : `{path}`"
    detail: "Une archive `backup.zip` est téléchargeable : elle peut contenir tout le code source et des données sensibles."
    recommendation: "Supprime cette archive du webroot et stocke les sauvegardes hors ligne."
    explanation: "Une archive de sauvegarde laissée dans le webroot est téléchargeable en un clic. Elle contient typiquement une copie complète du site : code source, fichiers de configuration avec secrets, et parfois un dump de base de données."
    why: "Télécharger une sauvegarde complète, c'est obtenir tout le site d'un coup : code, configuration, secrets, données utilisateurs. C'est l'une des fuites les plus graves et les plus simples à exploiter."
    steps:
      - "Supprime l'archive `{path}` du webroot immédiatement."
      - "Stocke les sauvegardes hors ligne ou dans un espace de stockage privé non servi en HTTP."
      - "Considère le contenu comme exfiltré : régénère les secrets et préviens si des données personnelles étaient incluses."
      - "Bloque par précaution les extensions d'archive à la racine."
    stacks:
      nginx: "location ~* \\.(zip|tar|tar\\.gz|tgz|gz|7z|rar)$ { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx : location ~* \\.(zip|tar|gz|7z|rar)$ { deny all; return 404; }"
      apache: "<FilesMatch \"\\.(zip|tar|gz|7z|rar)$\"> Require all denied </FilesMatch>"
      cloudflare: "WAF → Custom rules → Block : (http.request.uri.path matches \"\\.(zip|tar|gz|7z|rar)$\")"
    ai_prompt: "Tu es un expert en sécurité web. Le site {host} (servi par {stack}) expose l'archive de sauvegarde `{path}`, téléchargeable et potentiellement complète. Explique le risque, donne la configuration exacte pour {stack} qui bloque les archives, et conseille de stocker les sauvegardes hors ligne."
    refs:
      - "https://cwe.mitre.org/data/definitions/530.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    a_verifier: false

