exposed-phpinfo:
  found:
    title: "Fichier sensible exposé : `{path}`"
    detail: "Une page `phpinfo()` est accessible : elle divulgue la configuration PHP, les chemins serveur, les modules et des variables d'environnement."
    recommendation: "Supprime ce fichier de diagnostic ; il ne doit jamais rester en production."
    explanation: "La fonction `phpinfo()` affiche un rapport détaillé de l'environnement PHP : version exacte, modules chargés, chemins absolus du serveur, et le contenu des variables d'environnement — qui peuvent inclure des secrets. C'est un outil de diagnostic qui n'a rien à faire en production."
    why: "Cette page offre à l'attaquant une reconnaissance complète : version PHP (CVE ciblées), chemins serveur (pour des inclusions de fichiers), et parfois des secrets exposés via les variables d'environnement."
    steps:
      - "Supprime `{path}` (et tout autre fichier appelant `phpinfo()`) du serveur de production."
      - "Désactive la fonction en production via `disable_functions = phpinfo` dans le `php.ini`."
      - "Bloque par précaution ce chemin côté serveur."
      - "Vérifie que `curl https://{host}/{path}` ne renvoie plus le rapport phpinfo."
    stacks:
      nginx: "location ~* /phpinfo\\.php$ { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx : location ~* /phpinfo\\.php$ { deny all; return 404; }"
      apache: "<FilesMatch \"phpinfo\\.php$\"> Require all denied </FilesMatch>"
      cloudflare: "WAF → Custom rules → Block : (http.request.uri.path contains \"phpinfo.php\")"
    ai_prompt: "Tu es un expert en sécurité web. Le site {host} (servi par {stack}) expose `{path}`, une page phpinfo() qui divulgue toute la configuration PHP et parfois des secrets. Explique le risque de reconnaissance, donne la configuration exacte pour {stack} qui bloque ce fichier, et rappelle qu'une page de diagnostic ne doit jamais rester en production."
