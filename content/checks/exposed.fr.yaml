      npm: "Proxy Host → Advanced → Custom Nginx : location ~* \\.(bak|old|save)$ { deny all; return 404; }"
      apache: "<FilesMatch \"\\.(bak|old|save)$\"> Require all denied </FilesMatch>"
      cloudflare: "WAF → Custom rules → Block : (http.request.uri.path matches \"\\.(bak|old|save)$\")"
    ai_prompt: "Tu es un expert en sécurité web. Le site {host} (servi par {stack}) expose `{path}`, une sauvegarde de config servie en clair qui révèle identifiants et clés. Explique le risque, donne la configuration exacte pour {stack} qui bloque les extensions de sauvegarde, et rappelle de régénérer les secrets exposés."
