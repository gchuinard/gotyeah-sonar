# Fichiers/chemins sensibles exposés — catalogue de présentation FR.
# `title` / `detail` / `recommendation` reproduisent EXACTEMENT le texte historique
# (garde anti-régression : tests/test_regression_fr.py). Le reste (explanation, why,
# steps, stacks, ai_prompt, refs) est le contenu de remédiation façon GTmetrix.
# Le `title` est commun aux 14 chemins (seul {path} change) ; detail/reco sont
# spécifiques. Placeholders : {path} (le chemin sondé) ; {stack} est rempli côté UI.

exposed-env:
  found:
    title: "Fichier sensible exposé : `{path}`"
    detail: "Un fichier `.env` est servi publiquement : il contient typiquement des secrets (clés API, identifiants base de données, tokens)."
    recommendation: "Sors `.env` du webroot et bloque le chemin côté serveur (`location ~ /\\.env { deny all; }`)."
    explanation: "Un fichier `.env` regroupe la configuration sensible d'une application : clés d'API, identifiants de base de données, secrets de session, tokens. Servi en HTTP, son contenu est lisible par n'importe qui d'un simple `curl`, ce qui revient à publier ses mots de passe."
    why: "Avec les secrets d'un `.env`, un attaquant accède directement à la base de données, usurpe l'identité de l'application auprès des API tierces et peut prendre le contrôle complet du service. C'est l'une des fuites les plus directement exploitables."
    steps:
      - "Sors le fichier `.env` du webroot : place-le dans un répertoire non servi par le serveur web."
      - "Ajoute une règle qui refuse l'accès aux fichiers commençant par un point (`location ~ /\\.` deny all)."
      - "Considère les secrets contenus comme compromis : régénère clés d'API, mots de passe et tokens."
      - "Vérifie ensuite qu'un `curl https://{host}/.env` renvoie bien 403/404."
    stacks:
      nginx: "location ~ /\\.env { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx : location ~ /\\.env { deny all; return 404; }"
      apache: "<FilesMatch \"^\\.env\"> Require all denied </FilesMatch>"
      cloudflare: "WAF → Custom rules → Block : (http.request.uri.path contains \"/.env\")"
    ai_prompt: "Tu es un expert en sécurité web. Le site {host} (servi par {stack}) expose publiquement le fichier `{path}`, qui contient des secrets d'application. Explique le risque, donne la configuration exacte pour {stack} qui bloque l'accès à ce chemin, et rappelle qu'il faut considérer les secrets comme compromis et les régénérer."
    refs:
      - "https://owasp.org/www-community/vulnerabilities/Information_exposure_through_query_strings_in_url"
      - "https://cwe.mitre.org/data/definitions/538.html"
    a_verifier: false

exposed-env-bak:
  found:
    title: "Fichier sensible exposé : `{path}`"
    detail: "Une sauvegarde `.env.bak` est accessible : même expirée, elle peut révéler des secrets encore valides."
    recommendation: "Supprime cette sauvegarde du webroot et bloque les extensions `.bak`."
    explanation: "Les fichiers de sauvegarde (`.bak`, `.old`, `~`…) sont servis tels quels par le serveur web : contrairement au fichier d'origine éventuellement interprété, leur contenu brut est renvoyé. Une copie de `.env` ainsi exposée divulgue les secrets qu'elle contient."
    why: "Une sauvegarde n'est pas forcément à jour, mais les secrets qu'elle contient (mots de passe, clés) sont souvent encore valides : un attaquant les récupère et s'en sert immédiatement contre le service en production."
    steps:
      - "Supprime le fichier `{path}` du webroot."
      - "Bloque côté serveur toutes les extensions de sauvegarde (`.bak`, `.old`, `.save`, `~`)."
      - "Régénère les secrets si la sauvegarde a pu être téléchargée."
      - "Vérifie que `curl https://{host}/{path}` renvoie 403/404."
    stacks:
      nginx: "location ~* \\.(bak|old|save|swp|~)$ { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx : location ~* \\.(bak|old|save)$ { deny all; return 404; }"
      apache: "<FilesMatch \"\\.(bak|old|save)$\"> Require all denied </FilesMatch>"
      cloudflare: "WAF → Custom rules → Block : (http.request.uri.path matches \"\\.(bak|old|save)$\")"
    ai_prompt: "Tu es un expert en sécurité web. Le site {host} (servi par {stack}) expose le fichier de sauvegarde `{path}`, dont le contenu brut peut révéler des secrets. Explique le risque, donne la configuration exacte pour {stack} qui bloque les extensions de sauvegarde, et rappelle de régénérer les secrets exposés."
    refs:
      - "https://cwe.mitre.org/data/definitions/530.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    a_verifier: false

exposed-git:
  found:
    title: "Fichier sensible exposé : `{path}`"
    detail: "Un dépôt Git semble exposé (`.git/HEAD` lisible) : tout l'historique du code source peut être reconstitué et téléchargé."
    recommendation: "Empêche l'accès à `.git/` côté serveur (`location ~ /\\.git { deny all; }`) et ne déploie jamais le dépôt dans le webroot."
    explanation: "Si le répertoire `.git/` est accessible, des outils automatisés (git-dumper…) reconstituent l'intégralité du dépôt : code source, historique, branches, et tout ce qui a été committé un jour — y compris des secrets supprimés depuis mais toujours présents dans l'historique."
    why: "Récupérer le dépôt, c'est obtenir le code source complet (logique métier, vulnérabilités exploitables) et souvent des secrets oubliés dans l'historique. C'est une fuite massive et entièrement automatisable."
    steps:
      - "Bloque l'accès au répertoire `.git/` côté serveur."
      - "Ne déploie jamais le dépôt Git dans le webroot : déploie une copie sans `.git/` (export/build)."
      - "Audite l'historique pour les secrets committés et révoque-les."
      - "Vérifie que `curl https://{host}/.git/HEAD` renvoie 403/404."
    stacks:
      nginx: "location ~ /\\.git { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx : location ~ /\\.git { deny all; return 404; }"
      apache: "<DirectoryMatch \"\\.git\"> Require all denied </DirectoryMatch>"
      cloudflare: "WAF → Custom rules → Block : (http.request.uri.path contains \"/.git/\")"
    ai_prompt: "Tu es un expert en sécurité web. Le site {host} (servi par {stack}) expose son dépôt Git via `{path}`, ce qui permet de reconstituer tout le code source et l'historique. Explique le risque, donne la configuration exacte pour {stack} qui bloque l'accès à `.git/`, et conseille de ne jamais déployer le dépôt dans le webroot."
    refs:
      - "https://cwe.mitre.org/data/definitions/527.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    a_verifier: false

exposed-git-config:
  found:
    title: "Fichier sensible exposé : `{path}`"
    detail: "Le fichier `.git/config` est lisible : il confirme un dépôt Git exposé et peut divulguer des URLs de remote (parfois avec identifiants)."
    recommendation: "Bloque l'accès au répertoire `.git/` côté serveur."
    explanation: "Le fichier `.git/config` décrit la configuration du dépôt : ses remotes, leurs URLs et parfois des identifiants encodés dedans (`https://user:token@host/...`). Sa lisibilité confirme que tout le répertoire `.git/` est accessible."
    why: "Au-delà de confirmer l'exposition du dépôt, `.git/config` peut révéler des URLs de remote contenant des tokens d'accès : un attaquant les réutilise pour accéder à d'autres dépôts ou services internes."
    steps:
      - "Bloque l'accès au répertoire `.git/` côté serveur."
      - "Si une URL de remote contenait des identifiants, révoque ce token immédiatement."
      - "Ne déploie pas le dépôt Git dans le webroot."
      - "Vérifie que `curl https://{host}/.git/config` renvoie 403/404."
    stacks:
      nginx: "location ~ /\\.git { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx : location ~ /\\.git { deny all; return 404; }"
      apache: "<DirectoryMatch \"\\.git\"> Require all denied </DirectoryMatch>"
      cloudflare: "WAF → Custom rules → Block : (http.request.uri.path contains \"/.git/\")"
    ai_prompt: "Tu es un expert en sécurité web. Le site {host} (servi par {stack}) expose `{path}`, qui confirme un dépôt Git accessible et peut divulguer des URLs de remote avec identifiants. Explique le risque, donne la configuration exacte pour {stack} qui bloque `.git/`, et conseille de révoquer tout token éventuellement exposé."
    refs:
      - "https://cwe.mitre.org/data/definitions/527.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    a_verifier: false

