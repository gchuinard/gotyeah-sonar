# Detected technologies/versions — EN presentation catalogue.
# `title` / `detail` / `recommendation` mirror the FR remediation content.
# The rest (explanation, why, steps, stacks, ai_prompt, refs) is GTmetrix-style
# remediation content.
# Placeholders: {name} (detected tech), {version} (exposed version). {stack} is
# filled in by the UI.

tech:
  detected:
    title: "Technology detected: {name}"
    detail: "Application fingerprint spotted passively (headers, cookies or HTML)."
    explanation: "An application fingerprint is the trace a piece of software leaves in what it returns: a name in the `Server` header, a characteristic cookie (`PHPSESSID`, `wordpress_…`), a `<meta name=\"generator\">` tag or a revealing path in the HTML (`/wp-content/`). Spotted passively, it tells you which technology (`{name}`) runs the site."
    why: "Knowing that a site runs on `{name}` is the first step of reconnaissance: an attacker then tailors their probes to the known weaknesses of that technology. It is not a vulnerability in itself — it is information. The disclosure becomes problematic mainly when it comes with a precise version number (reported separately)."
    a_verifier: false
  version:
    title: "Version exposed: {name} {version}"
    detail: "The precise version of `{name}` ({version}) is revealed, which makes it easier to target known CVEs."
    recommendation: "Hide the version: `server_tokens off`, remove `X-Powered-By`, delete the `<meta name=\"generator\">` tag."
    explanation: "Beyond the bare technology name, here it is the exact version number (`{name} {version}`) that leaks — via a header, a cookie, a `<meta name=\"generator\">` tag or the HTML. Yet a given version maps to a public list of vulnerabilities (CVEs)."
    why: "Knowing `{name} {version}` lets an attacker look up the known CVEs for that precise version directly and launch the matching exploits, without trial and error. Hiding the version does not fix the flaws but slows down reconnaissance and breaks automated scans that target an exact version."
    steps:
      - "Disable version display on the origin server (e.g. `server_tokens off` for nginx, `ServerTokens Prod` for Apache, `expose_php = Off` for PHP)."
      - "Remove the headers that announce a piece of software and its version: `X-Powered-By`, `X-Generator`, `X-AspNet-Version`."
      - "Delete the `<meta name=\"generator\">` tag generated by the CMS (`{name}`) in your templates/theme."
      - "On the reverse proxy, hide or rewrite the headers sent by the upstream (`proxy_hide_header`)."
    stacks:
      nginx: "server_tokens off; proxy_hide_header X-Powered-By; more_clear_headers Server; (headers-more module)"
      npm: "Proxy Host → Advanced → Custom Nginx: proxy_hide_header X-Powered-By; proxy_hide_header Server;"
      apache: "ServerTokens Prod ; ServerSignature Off ; Header always unset X-Powered-By"
      cloudflare: "Transform Rules → Modify Response Header → Remove: Server / X-Powered-By / X-Generator"
      wordpress: "Remove the generator tag: `remove_action('wp_head', 'wp_generator');` in functions.php; hide the version server-side."
    ai_prompt: "You are a web security expert. The site {host} (served by {stack}) exposes the precise version of {name} ({version}). Explain the risk of reconnaissance and CVE targeting, then give the exact configuration for {stack} to hide the version: removing the `<meta name=\"generator\">` tag, stripping the X-Powered-By / Server headers, and disabling version display (server_tokens off or equivalent)."
    refs:
      - "https://owasp.org/www-project-secure-headers/"
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Server"
    a_verifier: false
  none:
    title: "No obvious technology/version exposed"
    detail: "No notable application fingerprint was spotted passively."
    why: "No technology or version is announced passively: fingerprint-based reconnaissance (headers, cookies, HTML) is limited."
