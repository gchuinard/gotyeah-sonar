exposed-compose:
  found:
    title: "Sensitive file exposed: `{path}`"
    detail: "A `docker-compose.yml` file is accessible: it reveals the service architecture, internal ports, and sometimes sensitive variables."
    recommendation: "Remove this file from the webroot; it has no business being online."
    explanation: "A `docker-compose.yml` describes the entire containerized infrastructure: services, images, internal ports, volumes, and — frequently — environment variables with cleartext passwords or keys. It is a deployment file that has no reason to be served over HTTP."
    why: "Reading this file gives the attacker a map of the architecture (internal services, ports, dependencies) and sometimes secrets directly: it is very high-value reconnaissance, even an immediate compromise."
    steps:
      - "Remove `{path}` from the webroot: this deployment file must not be served."
      - "As a precaution, block `.yml`/`.yaml` files at the root server-side."
      - "If secrets appeared in cleartext, treat them as compromised and regenerate them."
      - "Verify that `curl https://{host}/{path}` returns 403/404."
    stacks:
      nginx: "location ~* /(docker-compose\\.ya?ml|\\.env)$ { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx: location ~* /docker-compose\\.ya?ml$ { deny all; return 404; }"
      apache: "<FilesMatch \"docker-compose\\.ya?ml$\"> Require all denied </FilesMatch>"
      cloudflare: "WAF → Custom rules → Block: (http.request.uri.path contains \"docker-compose.yml\")"
    ai_prompt: "You are a web security expert. The site {host} (served by {stack}) exposes `{path}`, which reveals the service architecture and sometimes secrets. Explain the risk, give the exact configuration for {stack} that blocks this file, and remind that a deployment file must never be served over HTTP."
    refs:
      - "https://cwe.mitre.org/data/definitions/538.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    a_verifier: false

exposed-dockerfile:
  found:
    title: "Sensitive file exposed: `{path}`"
    detail: "A `Dockerfile` is accessible: it exposes the build chain, versions, and sometimes secrets passed as arguments."
    recommendation: "Remove this file from the webroot."
    explanation: "A `Dockerfile` describes how the application image is built: base image and its version, installed packages, build steps, and arguments. It can reveal vulnerable versions and, when secrets are passed as `ARG`/`ENV`, expose them directly."
    why: "Knowing the build chain and exact versions helps the attacker target known CVEs; and any secret left in the `Dockerfile` (token, password) becomes directly exploitable."
    steps:
      - "Remove `{path}` from the webroot: this build file should not be served."
      - "Verify that no secret is passed as `ARG`/`ENV` in the Dockerfile (use dedicated build secrets)."
      - "As a precaution, block `Dockerfile` at the root server-side."
      - "Verify that `curl https://{host}/{path}` returns 403/404."
    stacks:
      nginx: "location ~* /Dockerfile { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx: location ~* /Dockerfile { deny all; return 404; }"
      apache: "<FilesMatch \"^Dockerfile\"> Require all denied </FilesMatch>"
      cloudflare: "WAF → Custom rules → Block: (http.request.uri.path contains \"/Dockerfile\")"
    ai_prompt: "You are a web security expert. The site {host} (served by {stack}) exposes `{path}`, which reveals the build chain and sometimes secrets. Explain the risk, give the exact configuration for {stack} that blocks this file, and remind that a secret must never appear in cleartext in a Dockerfile."
    refs:
      - "https://cwe.mitre.org/data/definitions/538.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
