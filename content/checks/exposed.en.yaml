exposed-wpconfig:
  found:
    title: "Sensitive file exposed: `{path}`"
    detail: "The `wp-config.php` file is served in clear text: it holds the WordPress database credentials and security keys (salts)."
    recommendation: "Block access to `wp-config.php` server-side and regenerate credentials and salts if the file could be read."
    explanation: "Normally `wp-config.php` is interpreted by PHP and its code is never returned. When served in clear text (misconfiguration, backup, PHP disabled), its contents — `DB_NAME`, `DB_USER`, `DB_PASSWORD`, `DB_HOST` and the `AUTH_KEY`/salts — become readable by anyone."
    why: "With the database credentials and salts, an attacker connects directly to the WordPress database, forges valid authentication cookies and takes over the site. It is an immediate compromise."
    steps:
      - "Block direct access to `wp-config.php` server-side."
      - "Check that PHP is actually running (a `wp-config.php` returned as text signals PHP is not executing)."
      - "Regenerate the database password and the keys/salts (`AUTH_KEY`, etc.): treat them as compromised."
      - "Verify that `curl https://{host}/{path}` no longer returns the source code."
    stacks:
      nginx: "location = /wp-config.php { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx: location = /wp-config.php { deny all; return 404; }"
      apache: "<FilesMatch \"^wp-config\\.php$\"> Require all denied </FilesMatch>"
      cloudflare: "WAF → Custom rules → Block: (http.request.uri.path eq \"/wp-config.php\")"
