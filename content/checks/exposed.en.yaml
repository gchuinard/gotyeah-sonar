exposed-backup-zip:
  found:
    title: "Sensitive file exposed: `{path}`"
    detail: "A `backup.zip` archive is downloadable: it may contain the entire source code and sensitive data."
    recommendation: "Delete this archive from the webroot and store backups offline."
    explanation: "A backup archive left in the webroot is downloadable in one click. It typically contains a complete copy of the site: source code, configuration files with secrets, and sometimes a database dump."
    why: "Downloading a complete backup means obtaining the entire site at once: code, configuration, secrets, user data. It is one of the most severe and simplest leaks to exploit."
    steps:
      - "Delete the `{path}` archive from the webroot immediately."
      - "Store backups offline or in a private storage space not served over HTTP."
      - "Treat the content as exfiltrated: regenerate the secrets and notify if personal data was included."
      - "As a precaution, block archive extensions at the root."
    stacks:
      nginx: "location ~* \\.(zip|tar|tar\\.gz|tgz|gz|7z|rar)$ { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx: location ~* \\.(zip|tar|gz|7z|rar)$ { deny all; return 404; }"
      apache: "<FilesMatch \"\\.(zip|tar|gz|7z|rar)$\"> Require all denied </FilesMatch>"
      cloudflare: "WAF → Custom rules → Block: (http.request.uri.path matches \"\\.(zip|tar|gz|7z|rar)$\")"
    ai_prompt: "You are a web security expert. The site {host} (served by {stack}) exposes the backup archive `{path}`, downloadable and potentially complete. Explain the risk, give the exact configuration for {stack} that blocks archives, and advise storing backups offline."
    refs:
      - "https://cwe.mitre.org/data/definitions/530.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    a_verifier: false

exposed-backup-sql:
  found:
    title: "Sensitive file exposed: `{path}`"
    detail: "A `backup.sql` SQL dump is downloadable: it likely exposes the entire database."
    recommendation: "Delete this dump from the webroot; never store a database backup accessible over HTTP."
    explanation: "An SQL dump left in the webroot is downloadable directly. It contains the complete export of the database: schema, but above all all the data — user accounts, passwords (sometimes poorly hashed), e-mails, business data."
    why: "Retrieving a database dump means exfiltrating all the data in one request: credentials, personal data, application secrets. The impact (GDPR, account takeover) is immediate and major."
    steps:
      - "Delete the `{path}` dump from the webroot immediately."
      - "Never store a database backup accessible over HTTP: use private offline storage."
      - "Treat the data as exfiltrated: force a password reset and apply your notification obligations."
      - "As a precaution, block `.sql`/`.dump` extensions at the root."
    stacks:
      nginx: "location ~* \\.(sql|dump|db|sqlite)$ { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx: location ~* \\.(sql|dump|db|sqlite)$ { deny all; return 404; }"
      apache: "<FilesMatch \"\\.(sql|dump|db|sqlite)$\"> Require all denied </FilesMatch>"
      cloudflare: "WAF → Custom rules → Block: (http.request.uri.path matches \"\\.(sql|dump|db|sqlite)$\")"
    ai_prompt: "You are a web security expert. The site {host} (served by {stack}) exposes the SQL dump `{path}`, which likely contains the entire database. Explain the risk (data exfiltration, GDPR), give the exact configuration for {stack} that blocks dumps, and advise storing backups offline."
    refs:
      - "https://cwe.mitre.org/data/definitions/530.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    a_verifier: false

