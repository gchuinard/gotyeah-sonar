    detail: "A `.DS_Store` file is exposed: it lists the directory's file names and facilitates the enumeration of hidden paths."
    recommendation: "Delete `.DS_Store` files from the webroot and block this name server-side."
    explanation: "The `.DS_Store` file is generated by macOS in every folder it displays. It records the directory's file list — including those not linked anywhere. Exposed, it reveals \"hidden\" paths an attacker would not have guessed."
    why: "Path enumeration facilitates reconnaissance: an attacker discovers administrative files, backups, or non-public entry points, and focuses tests on real targets rather than guessing blindly."
