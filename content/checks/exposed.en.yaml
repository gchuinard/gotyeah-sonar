# Sensitive files/paths exposed — EN presentation catalogue.
# `title` / `detail` / `recommendation` mirror the EN-facing text. The rest
# (explanation, why, steps, stacks, ai_prompt, refs) is the remediation content
# GTmetrix-style.
# The `title` is shared across the 14 paths (only {path} changes) ; detail/reco are
# specific. Placeholders : {path} (the probed path) ; {stack} is filled in by the UI.

exposed-env:
  found:
    title: "Sensitive file exposed: `{path}`"
    detail: "An `.env` file is served publicly: it typically contains secrets (API keys, database credentials, tokens)."
    recommendation: "Move `.env` out of the webroot and block the path server-side (`location ~ /\\.env { deny all; }`)."
    explanation: "An `.env` file gathers an application's sensitive configuration: API keys, database credentials, session secrets, tokens. Served over HTTP, its contents are readable by anyone with a simple `curl`, which is equivalent to publishing your passwords."
    why: "With the secrets from a `.env`, an attacker directly accesses the database, impersonates the application to third-party APIs, and can take complete control of the service. It is one of the most directly exploitable leaks."
    steps:
      - "Move the `.env` file out of the webroot: place it in a directory not served by the web server."
      - "Add a rule that denies access to files starting with a dot (`location ~ /\\.` deny all)."
      - "Treat the contained secrets as compromised: regenerate API keys, passwords, and tokens."
      - "Then verify that a `curl https://{host}/.env` returns 403/404."
    stacks:
      nginx: "location ~ /\\.env { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx: location ~ /\\.env { deny all; return 404; }"
      apache: "<FilesMatch \"^\\.env\"> Require all denied </FilesMatch>"
      cloudflare: "WAF → Custom rules → Block: (http.request.uri.path contains \"/.env\")"
    ai_prompt: "You are a web security expert. The site {host} (served by {stack}) publicly exposes the file `{path}`, which contains application secrets. Explain the risk, give the exact configuration for {stack} that blocks access to this path, and remind that the secrets must be treated as compromised and regenerated."
    refs:
      - "https://owasp.org/www-community/vulnerabilities/Information_exposure_through_query_strings_in_url"
      - "https://cwe.mitre.org/data/definitions/538.html"
    a_verifier: false

exposed-env-bak:
  found:
    title: "Sensitive file exposed: `{path}`"
    detail: "An `.env.bak` backup is accessible: even if stale, it can reveal still-valid secrets."
    recommendation: "Delete this backup from the webroot and block `.bak` extensions."
    explanation: "Backup files (`.bak`, `.old`, `~`…) are served as-is by the web server: unlike the original file that may be interpreted, their raw content is returned. A copy of `.env` exposed this way discloses the secrets it contains."
    why: "A backup is not necessarily up to date, but the secrets it contains (passwords, keys) are often still valid: an attacker retrieves them and uses them immediately against the production service."
    steps:
      - "Delete the `{path}` file from the webroot."
      - "Block all backup extensions server-side (`.bak`, `.old`, `.save`, `~`)."
      - "Regenerate the secrets if the backup could have been downloaded."
      - "Verify that `curl https://{host}/{path}` returns 403/404."
    stacks:
      nginx: "location ~* \\.(bak|old|save|swp|~)$ { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx: location ~* \\.(bak|old|save)$ { deny all; return 404; }"
      apache: "<FilesMatch \"\\.(bak|old|save)$\"> Require all denied </FilesMatch>"
      cloudflare: "WAF → Custom rules → Block: (http.request.uri.path matches \"\\.(bak|old|save)$\")"
    ai_prompt: "You are a web security expert. The site {host} (served by {stack}) exposes the backup file `{path}`, whose raw content can reveal secrets. Explain the risk, give the exact configuration for {stack} that blocks backup extensions, and remind to regenerate the exposed secrets."
    refs:
      - "https://cwe.mitre.org/data/definitions/530.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    a_verifier: false

exposed-git:
  found:
    title: "Sensitive file exposed: `{path}`"
    detail: "A Git repository appears exposed (`.git/HEAD` readable): the entire source-code history can be reconstructed and downloaded."
    recommendation: "Prevent access to `.git/` server-side (`location ~ /\\.git { deny all; }`) and never deploy the repository inside the webroot."
    explanation: "If the `.git/` directory is accessible, automated tools (git-dumper…) reconstruct the entire repository: source code, history, branches, and everything ever committed — including secrets removed since but still present in the history."
    why: "Retrieving the repository means obtaining the complete source code (business logic, exploitable vulnerabilities) and often secrets forgotten in the history. It is a massive and fully automatable leak."
    steps:
      - "Block access to the `.git/` directory server-side."
      - "Never deploy the Git repository inside the webroot: deploy a copy without `.git/` (export/build)."
      - "Audit the history for committed secrets and revoke them."
      - "Verify that `curl https://{host}/.git/HEAD` returns 403/404."
    stacks:
      nginx: "location ~ /\\.git { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx: location ~ /\\.git { deny all; return 404; }"
      apache: "<DirectoryMatch \"\\.git\"> Require all denied </DirectoryMatch>"
      cloudflare: "WAF → Custom rules → Block: (http.request.uri.path contains \"/.git/\")"
    ai_prompt: "You are a web security expert. The site {host} (served by {stack}) exposes its Git repository via `{path}`, which allows reconstructing the entire source code and history. Explain the risk, give the exact configuration for {stack} that blocks access to `.git/`, and advise never deploying the repository inside the webroot."
    refs:
      - "https://cwe.mitre.org/data/definitions/527.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    a_verifier: false

exposed-git-config:
  found:
    title: "Sensitive file exposed: `{path}`"
    detail: "The `.git/config` file is readable: it confirms an exposed Git repository and can disclose remote URLs (sometimes with credentials)."
    recommendation: "Block access to the `.git/` directory server-side."
    explanation: "The `.git/config` file describes the repository configuration: its remotes, their URLs, and sometimes credentials encoded in them (`https://user:token@host/...`). Its readability confirms that the entire `.git/` directory is accessible."
    why: "Beyond confirming the repository's exposure, `.git/config` can reveal remote URLs containing access tokens: an attacker reuses them to access other repositories or internal services."
    steps:
      - "Block access to the `.git/` directory server-side."
      - "If a remote URL contained credentials, revoke that token immediately."
      - "Do not deploy the Git repository inside the webroot."
      - "Verify that `curl https://{host}/.git/config` returns 403/404."
    stacks:
      nginx: "location ~ /\\.git { deny all; return 404; }"
      npm: "Proxy Host → Advanced → Custom Nginx: location ~ /\\.git { deny all; return 404; }"
      apache: "<DirectoryMatch \"\\.git\"> Require all denied </DirectoryMatch>"
      cloudflare: "WAF → Custom rules → Block: (http.request.uri.path contains \"/.git/\")"
    ai_prompt: "You are a web security expert. The site {host} (served by {stack}) exposes `{path}`, which confirms an accessible Git repository and can disclose remote URLs with credentials. Explain the risk, give the exact configuration for {stack} that blocks `.git/`, and advise revoking any potentially exposed token."
    refs:
      - "https://cwe.mitre.org/data/definitions/527.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    a_verifier: false

