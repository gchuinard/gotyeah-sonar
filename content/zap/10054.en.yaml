# Generated by transformation of ZAP sources (tools/zap_sources/zap_alerts.json).
# pluginId 10054 — Cookie Without SameSite Attribute. reviewed (a_verifier: false).

alert:
  title: "Cookie without SameSite attribute"
  detail: "A cookie is set without a SameSite attribute: the browser can therefore send it back on a \"cross-site\" request (initiated from another site)."
  explanation: "A cookie's SameSite attribute tells the browser in which cases it is allowed to accompany a request to your domain. With `SameSite=Lax` or `SameSite=Strict`, the cookie is no longer sent automatically when the request originates from a third-party site."
  why: "A cookie without SameSite is attached to requests triggered from any other site. This is a lever for cross-site request forgery (CSRF), cross-site script inclusion and timing attacks: a malicious site can make the victim's browser act on their behalf, with their session."
  steps:
    - "Set the SameSite attribute on ALL cookies, to `Lax` at minimum or, ideally, to `Strict`."
    - "Choose `Strict` for sensitive session cookies (the cookie is never sent from another site); keep `Lax` if an incoming link navigation must remain logged in."
    - "If you use `SameSite=None` for a legitimate cross-site use case, it must imperatively be accompanied by the `Secure` attribute."
    - "Check the returned `Set-Cookie` header to confirm the attribute is indeed present on each cookie."
  stacks:
    app: "Set the attribute when emitting the cookie, e.g. Set-Cookie: session=...; SameSite=Strict; Secure; HttpOnly (framework side: the SameSite option of the session cookie)."
    nginx: "If the cookie is set by the upstream, rewrite the header as it passes through the proxy: proxy_cookie_flags ~ samesite=strict; (Nginx ≥ 1.19.3)."
    npm: "Proxy Host → Advanced → Custom Nginx Configuration: proxy_cookie_flags ~ samesite=strict;"
    apache: "Header always edit Set-Cookie ^(.*)$ \"$1; SameSite=Strict\""
  ai_prompt: "You are a web security expert. On {host} (served by {stack}), one or more cookies are set without a SameSite attribute. Explain the risk of CSRF/cross-site inclusion, then show how to set `SameSite=Strict` (or `Lax` failing that) on the cookies — first at emission on the application side, otherwise via rewriting the Set-Cookie header for {stack}. Remind that `SameSite=None` requires the `Secure` attribute."
  refs:
    - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Set-Cookie/SameSite"
    - "https://cwe.mitre.org/data/definitions/1275.html"
  a_verifier: false
