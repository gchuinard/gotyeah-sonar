# Generated by transformation of ZAP sources (tools/zap_sources/zap_alerts.json).
# pluginId 10011 — Cookie Without Secure Flag. reviewed (a_verifier: false).

alert:
  title: "Cookie without Secure flag"
  detail: "A cookie is set without the Secure flag: it can therefore travel over unencrypted connections (plaintext HTTP)."
  explanation: "A cookie's Secure flag instructs the browser to send it only over encrypted connections (HTTPS). Without it, the cookie can be sent in clear text, exposed to any interception on the network."
  why: "A cookie without the Secure flag can be read by an attacker eavesdropping on the network (public Wi-Fi, hostile proxy) as soon as a request goes over HTTP. For a session token or any sensitive cookie, this amounts to handing the session to the attacker."
  steps:
    - "Identify the cookies that contain sensitive information or a session token: they must always travel over an encrypted channel."
    - "Set the `Secure` flag on these cookies so they are never sent over plaintext HTTP."
    - "Serve the entire site over HTTPS and redirect http→https, so that cookies marked Secure remain functional."
    - "Check the returned `Set-Cookie` header to confirm the presence of the `Secure` attribute."
  stacks:
    app: "Set the flag when emitting the cookie, e.g. Set-Cookie: session=...; Secure; HttpOnly; SameSite=Strict (framework side: the secure option of the session cookie)."
    nginx: "If the cookie comes from the upstream, add the flag as it passes through the proxy: proxy_cookie_flags ~ secure; (Nginx ≥ 1.19.3)."
    npm: "Proxy Host → Advanced → Custom Nginx Configuration: proxy_cookie_flags ~ secure;"
    apache: "Header always edit Set-Cookie ^(.*)$ \"$1; Secure\""
  ai_prompt: "You are a web security expert. On {host} (served by {stack}), one or more sensitive cookies are set without the Secure flag. Explain the risk of plaintext interception, then show how to set `Secure` on cookies containing a session token or sensitive data — first at emission on the application side, otherwise via rewriting the Set-Cookie header for {stack}."
  refs:
    - "https://owasp.org/www-community/controls/SecureCookieAttribute"
    - "https://cwe.mitre.org/data/definitions/614.html"
  a_verifier: false
