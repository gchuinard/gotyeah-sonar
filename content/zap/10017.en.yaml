# Generated by transformation of ZAP sources (tools/zap_sources/zap_alerts.json).
# pluginId 10017 — Cross-Domain JavaScript Source File Inclusion. reviewed (a_verifier: false).

alert:
  title: "JavaScript script inclusion from a third-party domain"
  detail: "The page loads one or more script files from a third-party domain (a domain you do not control)."
  explanation: "When a page includes a script via `<script src=\"...\">` pointing to another domain, that code runs with full privileges in the context of your page. You are then delegating part of your security to the third party: whatever they serve, your browser executes."
  why: "If the third-party domain is compromised, hijacked or replaced, the served script can be altered without your knowledge and run malicious code on your page: cookie/session theft, content injection, redirection. The risk grows if the script source can be influenced by users."
  steps:
    - "Make sure all JavaScript files are loaded only from trusted sources, and that those sources cannot be controlled by the application's users."
    - "For each third-party script that is genuinely needed, add a Subresource Integrity (`integrity`) attribute so the browser rejects any tampered content."
    - "Reduce the number of third-party dependencies: self-host critical scripts whenever possible."
  stacks:
    html: "On the <script src=\"https://cdn.example.com/lib.js\"></script> tag, add integrity=\"sha384-...\" and crossorigin=\"anonymous\" to pin the loaded version."
  ai_prompt: "You are a web security expert. The page on {host} (served by {stack}) includes one or more JavaScript scripts from third-party domains. Explain the risk of a compromised third party, then for each legitimate third-party script show how to add an `integrity` attribute (Subresource Integrity) and `crossorigin=\"anonymous\"` in the HTML, and how to verify that the script sources cannot be controlled by users. Do not make up a hash: leave a placeholder to be computed for each resource."
  refs:
    - "https://developer.mozilla.org/en-US/docs/Web/Security/Subresource_Integrity"
    - "https://cwe.mitre.org/data/definitions/829.html"
  a_verifier: false
