# Generated by transformation of ZAP sources (tools/zap_sources/zap_alerts.json).
# pluginId 90003 — Sub Resource Integrity Attribute Missing. reviewed (a_verifier: false).

alert:
  title: "Subresource Integrity (SRI) attribute missing"
  detail: "The `integrity` attribute is missing from a `<script>` or `<link>` tag served by an external server."
  explanation: "Subresource Integrity (SRI) consists of adding an `integrity` attribute to a `<script>` or `<link>` tag, containing the expected cryptographic hash of the resource. The browser recomputes the hash of the downloaded file and refuses to execute it if it does not match."
  why: "Without an `integrity` attribute, an attacker who has taken control of the external server (or CDN) can inject malicious content into the served file: your browser would execute it without flinching. The SRI attribute blocks this substitution by rejecting any altered resource."
  steps:
    - "For each `<script>` or `<link>` tag loaded from an external server, provide a valid `integrity` attribute (the resource hash, e.g. `sha384-...`)."
    - "Compute the hash from the exact version you use (SRI generators or `openssl dgst -sha384 -binary | openssl base64 -A` produce the correct value)."
    - "Add `crossorigin=\"anonymous\"` to the relevant tags so the integrity check works on cross-origin resources."
    - "Pin a frozen version of the resource: if the third party updates it, the hash changes and you will need to regenerate the attribute."
  stacks:
    html: "<script> tag: <script src=\"https://cdn.example.com/lib.js\" integrity=\"sha384-...\" crossorigin=\"anonymous\"></script>"
  ai_prompt: "You are a web security expert. On {host} (served by {stack}), a `<script>` or `<link>` tag loaded from an external server has no `integrity` attribute (SRI). Explain the risk of injection via a compromised third-party server, then show how to add a valid `integrity` attribute and `crossorigin=\"anonymous\"` in the HTML, and how to compute the hash for the exact version used. Do not make up a hash: leave a placeholder to be computed."
  refs:
    - "https://developer.mozilla.org/en-US/docs/Web/Security/Subresource_Integrity"
    - "https://cwe.mitre.org/data/definitions/345.html"
  a_verifier: false
