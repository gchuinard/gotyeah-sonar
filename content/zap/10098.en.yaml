# Generated by transformation of ZAP sources (tools/zap_sources/zap_alerts.json).
# pluginId 10098 — Cross-Domain Misconfiguration (CORS). reviewed (a_verifier: false).

alert:
  title: "CORS misconfiguration (overly permissive cross-origin resource sharing)"
  detail: "The server's CORS configuration allows cross-domain read requests from arbitrary third-party domains, on unauthenticated APIs of this domain."
  explanation: "The CORS mechanism (Cross Origin Resource Sharing) relaxes the browser's \"same-origin policy\" via the `Access-Control-Allow-Origin` header. When this header allows any origin (for example `*`, or a systematic echo of the requested origin), a third-party site can read your domain's responses from the victim's browser."
  why: "An overly broad CORS configuration lets a third-party site read data served by your domain through a user's browser. If this data is accessible without authentication, it leaks to arbitrary origins you do not control."
  steps:
    - "Make sure sensitive data is not accessible in an unauthenticated manner (for example via an IP address allow-list)."
    - "Restrict the `Access-Control-Allow-Origin` header to a specific set of trusted domains, instead of `*` or an automatic echo of the requested origin."
    - "If no cross-origin sharing is needed, remove the CORS headers entirely so the browser strictly applies the same-origin policy."
    - "After the change, verify that legitimate origins still work and that arbitrary origins are properly rejected."
  stacks:
    nginx: "add_header Access-Control-Allow-Origin \"https://app.example.com\" always; (a single trusted origin; do not use \"*\" for authenticated APIs)."
    npm: "Proxy Host → Advanced → Custom Nginx Configuration: add_header Access-Control-Allow-Origin \"https://app.example.com\" always;"
    cloudflare: "Transform Rules → Modify Response Header → Set static: Access-Control-Allow-Origin = https://app.example.com (or remove the header if CORS is not needed)."
    express: "app.use(cors({ origin: \"https://app.example.com\" })) — explicit origin rather than origin: true or \"*\"."
    fastapi: "CORSMiddleware(allow_origins=[\"https://app.example.com\"]) — explicit list, never [\"*\"] with allow_credentials=True."
  ai_prompt: "You are a web security expert. On {host} (served by {stack}), the CORS configuration is too permissive: `Access-Control-Allow-Origin` allows arbitrary third-party origins. Explain the risk of cross-domain data reading, then show how to restrict `Access-Control-Allow-Origin` to an explicit list of trusted domains for {stack} (or how to remove the CORS headers if no cross-origin sharing is required). Do not propose `*` for authenticated APIs; leave a placeholder to be filled in for the origins actually allowed."
  refs:
    - "https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS"
    - "https://cwe.mitre.org/data/definitions/264.html"
  a_verifier: false
