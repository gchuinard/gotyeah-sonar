# Generated by transformation of ZAP sources (tools/zap_sources/zap_alerts.json).
# pluginId 10010 — Cookie No HttpOnly Flag. reviewed (a_verifier: false).

alert:
  title: "Cookie without HttpOnly flag"
  detail: "A cookie is set without the HttpOnly flag: it is therefore readable by the page's JavaScript."
  explanation: "A cookie's HttpOnly flag prevents the page's JavaScript from accessing it (`document.cookie`). The cookie keeps being sent to the server in requests, but becomes invisible to scripts running in the browser."
  why: "Without HttpOnly, a malicious script running on the page (via an XSS flaw) can read the cookie and send it to another site. If it is a session cookie, the attacker can then steal the session and impersonate the user."
  steps:
    - "Set the HttpOnly flag on ALL cookies, with priority on session and authentication cookies."
    - "Reserve the absence of HttpOnly only for cookies that genuinely need to be read by client-side JavaScript (rare case); otherwise, apply it by default."
    - "Combine it with `Secure` and `SameSite` to harden the protection of sensitive cookies."
    - "Check the returned `Set-Cookie` header to confirm the presence of the `HttpOnly` attribute."
  stacks:
    app: "Set the flag when emitting the cookie, e.g. Set-Cookie: session=...; HttpOnly; Secure; SameSite=Strict (framework side: the httpOnly option of the session cookie)."
    nginx: "If the cookie comes from the upstream, add the flag as it passes through the proxy: proxy_cookie_flags ~ httponly; (Nginx ≥ 1.19.3)."
    npm: "Proxy Host → Advanced → Custom Nginx Configuration: proxy_cookie_flags ~ httponly;"
    apache: "Header always edit Set-Cookie ^(.*)$ \"$1; HttpOnly\""
  ai_prompt: "You are a web security expert. On {host} (served by {stack}), one or more cookies are set without the HttpOnly flag. Explain the risk of session theft via XSS, then show how to set `HttpOnly` on the cookies — first at emission on the application side, otherwise via rewriting the Set-Cookie header for {stack}."
  refs:
    - "https://owasp.org/www-community/HttpOnly"
    - "https://cwe.mitre.org/data/definitions/1004.html"
  a_verifier: false
