services:
  sonar:
    build: .
    container_name: sonar
    ports:
      - "8000:8000"
    volumes:
      # Persiste l'historique des scans (la base SQLite vit dans /app/data)
      - ./data:/app/data
    restart: unless-stopped
    environment:
      # Toute la config vient du .env (voir .env.example). Les `:-` rendent
      # chaque variable optionnelle : l'app démarre même sans .env (valeurs par défaut).
      # --- Auth & emails (P0) ---
      - SONAR_BASE_URL=${SONAR_BASE_URL:-}                       # ex. https://sonar.gautierchuinard.com (liens magiques)
      - SONAR_MCP_REMOTE=${SONAR_MCP_REMOTE:-}                   # opt-in MCP distant (claude.ai web) — vide/off = désactivé
      - SONAR_OPEN_REGISTRATION=${SONAR_OPEN_REGISTRATION:-false}
      - SONAR_ADMIN_EMAIL=${SONAR_ADMIN_EMAIL:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - SONAR_MAIL_FROM=${SONAR_MAIL_FROM:-}
      - SONAR_MAIL_FROM_NAME=${SONAR_MAIL_FROM_NAME:-Sonar}
      # --- ZAP (Phase 3, optionnel) ---
      - ZAP_API_URL=${ZAP_API_URL:-}
      - ZAP_API_KEY=${ZAP_API_KEY:-}
      # Autres réglages possibles (mêmes que le code) : SONAR_MAGIC_TTL_MIN,
      # SONAR_SESSION_DAYS, SONAR_RATE_EMAIL/IP, ZAP_ACTIVE, NUCLEI_*…
    networks:
      - default   # réseau du projet (inchangé)
      - npm       # réseau partagé avec Nginx Proxy Manager

  # OWASP ZAP en démon (Phase 3, optionnel). Lourd (Java, ~1-2 Go RAM) : il ne
  # démarre QUE si tu l'actives via son profil :  docker compose --profile zap up -d
  # Pas de `ports:` => jamais exposé hors du réseau Docker ; seul `sonar` lui parle.
  zap:
    image: zaproxy/zap-stable
    container_name: zap
    profiles: ["zap"]
    command:
      - zap.sh
      - -daemon
      - -host
      - "0.0.0.0"
      - -port
      - "8090"
      - -config
      - "api.key=${ZAP_API_KEY:-}"
      - -config
      - "api.addrs.addr.name=.*"      # autorise l'API depuis les autres conteneurs
      - -config
      - "api.addrs.addr.regex=true"
    networks:
      - default
    restart: unless-stopped

networks:
  # Réseau par défaut du projet (gotyeah-sonar_default), créé automatiquement.
  default:
  # Réseau par défaut de Nginx Proxy Manager, déjà partagé par d'autres apps du Pi
  # (desha-moulin, chatpitre, yoga_app_prod...). NPM y est connecté en permanence
  # (c'est SON réseau) : sonar l'y rejoint pour que NPM résolve le nom « sonar » sans
  # connexion manuelle, et que le lien survive à une recréation du conteneur npm.
  # Externe => le réseau doit préexister (il est géré par la stack NPM).
  npm:
    external: true
    name: nginx-proxy-manager_default
