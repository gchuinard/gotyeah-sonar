name: Deploy to Pi

# CI : à chaque push sur main, on lance d'abord les tests (job "test"), puis on
# déploie sur le Raspberry Pi (job "deploy") UNIQUEMENT si les tests passent.
# Principe du deploy : le runner GitHub récupère le code, le synchronise sur le Pi via
# rsync/SSH, puis (re)construit et relance le conteneur. Le Pi n'a jamais besoin
# d'accéder lui-même à GitHub — il accepte juste la connexion SSH du runner.
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   SSH_HOST  hôte/IP du Pi (doit être joignable en SSH depuis Internet)
#   SSH_USER  utilisateur Linux sur le Pi
#   SSH_KEY   clé PRIVÉE (id_ed25519, contenu complet avec les lignes BEGIN/END)
#   SSH_KNOWN_HOSTS  clés d'hôte du Pi au format known_hosts, sous l'alias pi-gotyeah
# La clé PUBLIQUE correspondante doit être dans ~/.ssh/authorized_keys du SSH_USER.

on:
  push:
    branches: [main]
  workflow_dispatch:        # bouton « Run workflow » pour déclencher à la main

# Un seul déploiement à la fois, et on ne coupe JAMAIS celui qui tourne (25/09) : annulé en
# route, il laisse le Pi dans un état bancal (code synchronisé mais image pas reconstruite,
# ou conteneur arrêté). Un nouveau push attend la fin du précédent ; s'il en arrive plusieurs
# pendant ce temps, GitHub ne garde en attente que le plus récent.
concurrency:
  group: deploy-pi
  cancel-in-progress: false

env:
  REMOTE_DIR: /home/pi/sites/gotyeah-sonar   # dossier cible sur le Pi (chemin absolu)

jobs:
  test:
    # Image figée : ce job installe ses dépendances dans le Python DU SYSTÈME
    # (--break-system-packages), 3.12 sur Ubuntu 24.04 comme l'image Docker. ubuntu-latest
    # passe à Ubuntu 26 le 19/10/2026 et changerait ce Python sans prévenir.
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
      - name: Lancer la suite de tests (pytest)
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r requirements-dev.txt
          python3 -m pytest

  deploy:
    needs: test          # le déploiement n'a lieu que si le job "test" est vert
    runs-on: ubuntu-latest
    # Les secrets passent par env: et ne sont jamais interpolés dans les scripts (24/09) :
    # une valeur interpolée devient du code shell, une variable reste une donnée.
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      # Clés d'hôte du Pi lues dans le secret SSH_KNOWN_HOSTS (alias pi-gotyeah), plus de
      # scan de clés au déploiement (24/09) : un scan croit la première clé venue, et
      # des clés écrites en clair dans ce dépôt public mèneraient à l'IP du Pi via Censys
      # ou Shodan. Sans le secret, on s'arrête plutôt que de se connecter à l'aveugle.
      - name: Préparer la clé SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KNOWN_HOSTS" ]; then echo "::error::Secret SSH_KNOWN_HOSTS absent : sans lui, le déploiement accepterait n'importe quel hôte."; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts_pi

      - name: Synchroniser le code sur le Pi
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='data' \
            --exclude='__pycache__' \
            --exclude='*.db' \
            --exclude='.env' \
            --rsync-path="mkdir -p ${REMOTE_DIR} && rsync" \
            -e "ssh -i ~/.ssh/id_ed25519 -p 22 -o HostKeyAlias=pi-gotyeah -o UserKnownHostsFile=~/.ssh/known_hosts_pi -o StrictHostKeyChecking=yes" \
            ./ "$SSH_USER@$SSH_HOST:${REMOTE_DIR}/"

      - name: Construire et relancer le conteneur
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          # On construit l'image AVANT de toucher au conteneur (25/09) : l'ancienne version
          # supprimait d'abord le conteneur (docker rm -f) puis construisait, si bien que le
          # site restait coupé pendant tout le build, et pour de bon si le build échouait.
          # Désormais l'ancien conteneur sert jusqu'à ce que la nouvelle image soit prête, et
          # `up -d` ne fait plus que le recréer sur cette image (quelques secondes).
          #
          # Un conteneur "sonar" né ailleurs (ex. ancien déploiement depuis un autre dossier)
          # bloquerait le nom ET le port 8000, container_name étant fixe : on ne le retire
          # que si compose ne le reconnaît pas comme le sien, juste avant de recréer.
          ssh -i ~/.ssh/id_ed25519 -p 22 \
            -o HostKeyAlias=pi-gotyeah -o UserKnownHostsFile=~/.ssh/known_hosts_pi -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -e
             cd ${REMOTE_DIR}
             docker compose build
             if [ -n \"\$(docker ps -aq -f name=^sonar\$)\" ] && [ -z \"\$(docker compose ps -aq sonar)\" ]; then
               echo 'conteneur sonar orphelin (hors de ce projet compose) : suppression'
               docker rm -f sonar
             fi
             docker compose up -d
             docker image prune -f"

      # Le déploiement n'est réussi que si l'application RÉPOND. Sans cette étape, un
      # conteneur qui démarre puis meurt aussitôt passe pour un succès : `docker compose
      # up -d` rend 0 dès que le conteneur est CRÉÉ, il ne dit rien de ce qui tourne
      # dedans. C'est ce qui manquait ici, alors que le déploiement de radar le fait
      # depuis le premier jour.
      #
      # La sonde tourne DANS le conteneur : pas de réseau Docker à connaître, et un
      # imbriquement de guillemets en moins. Elle vérifie le CHAMP `status` plutôt que la
      # présence du mot « ok » quelque part dans le corps, pour qu'une page d'erreur qui
      # contiendrait ce mot ne passe pas pour une application saine.
      #
      # Six tentatives espacées de 5 s plutôt qu'un `sleep` fixe : sur le Pi, une image
      # fraîchement reconstruite met un temps variable à servir sa première requête, et un
      # délai fixe se règle toujours soit trop court, soit inutilement long. En cas
      # d'échec on imprime les dernières lignes de journal, sinon il faut ouvrir une
      # session SSH pour savoir de quoi le conteneur est mort.
      - name: Vérifier que le service répond
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 22 \
            -o HostKeyAlias=pi-gotyeah -o UserKnownHostsFile=~/.ssh/known_hosts_pi -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -e
             for tentative in 1 2 3 4 5 6; do
               if docker exec sonar python -c 'import json, urllib.request; d = json.load(urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\", timeout=5)); print(d); assert d[\"status\"] == \"ok\"'; then exit 0; fi
               echo \"tentative \$tentative sans reponse, nouvel essai dans 5 s\"
               sleep 5
             done
             echo 'sonar ne repond pas sur /healthz apres 30 s'
             docker logs --tail 40 sonar
             exit 1"
