name: Deploy to Pi

# Le déploiement attend la CI : il ne part qu'après un run réussi de ci.yml (lint, format,
# typage et tests, tous bloquants) sur un push de main, et installe le commit que ce run a
# testé. Jusqu'au 25/09/2026, il partait au push, en parallèle de la CI, derrière ses seuls
# tests (job "test") : un commit au lint, au format ou au typage rouges partait sur le Pi.
#
# Principe du deploy, depuis le 25/09/2026 : le runner ouvre une session SSH avec SSH_KEY,
# clé dédiée à ce dépôt. Sur le Pi, authorized_keys la force sur
# « /usr/local/sbin/gotyeah-deploy sonar » : le Pi met à jour sa copie de ce dépôt public
# (/home/pi/deploiement/gotyeah-sonar, git fetch sans clé), puis lance deploy/pi-deploy.sh,
# qui recopie le code dans le dossier du service, reconstruit, relance le conteneur et
# vérifie que le service répond. La commande envoyée ici ne choisit que le commit.
# Jusqu'au 25/09/2026, ce commentaire disait : le runner récupère le code, le synchronise
# sur le Pi par rsync/SSH, et le Pi n'a jamais besoin d'accéder lui-même à GitHub. C'était
# exact, mais il fallait pour cela une clé sans restriction sur un compte qui a sudo sans
# mot de passe, donc root sur le Pi. C'est désormais le Pi qui lit ce dépôt.
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   SSH_HOST  hôte/IP du Pi (doit être joignable en SSH depuis Internet)
#   SSH_USER  utilisateur Linux sur le Pi
#   SSH_KEY   clé PRIVÉE dédiée à ce dépôt (contenu complet avec les lignes BEGIN/END).
#             Elle sert aussi à l'étape Allure de ci.yml, que le Pi accepte avec la même
#             commande forcée (dépôt des résultats de tests seulement).
#   SSH_KNOWN_HOSTS  clés d'hôte du Pi au format known_hosts, sous l'alias pi-gotyeah
# La clé PUBLIQUE correspondante est dans ~/.ssh/authorized_keys du SSH_USER, précédée de
# restrict,command="/usr/local/sbin/gotyeah-deploy sonar".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:        # bouton « Run workflow » pour déclencher à la main

# Un seul déploiement à la fois, et on ne coupe JAMAIS celui qui tourne (25/09) : annulé en
# route, il laisse le Pi dans un état bancal (code synchronisé mais image pas reconstruite,
# ou conteneur arrêté). Un nouveau push attend la fin du précédent ; s'il en arrive plusieurs
# pendant ce temps, GitHub ne garde en attente que le plus récent.
concurrency:
  group: deploy-pi
  cancel-in-progress: false

permissions:
  contents: read
  # Lecture des runs de CI : un lancement manuel vérifie que le commit est vert.
  actions: read

env:
  # Le dossier du service sur le Pi (/home/pi/sites/gotyeah-sonar, ex REMOTE_DIR de ce
  # workflow) est désormais écrit dans deploy/pi-deploy.sh.
  # Le commit testé par la CI, et non la pointe de main au moment où ce workflow démarre.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Le job "test" qui précédait le déploiement a disparu (25/09/2026) : il rejouait pytest,
  # que ci.yml passe déjà sur ce même commit, en 3.12 comme l'image Docker.
  verifier:
    # Seul un push sur main compte : le run CI d'une pull request (même venue d'un fork
    # dont la branche s'appelle main) ne déploie jamais.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      deployer: ${{ steps.pointe.outputs.deployer }}
    steps:
      # Lancement manuel : pas de run CI en amont, on vérifie donc qu'il en existe un
      # réussi sur ce commit, et qu'il s'agit bien de main.
      - name: Vérifier que la CI est verte sur ce commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Le déploiement manuel ne part que de main."
            exit 1
          fi
          verts=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$DEPLOY_SHA" --status success --json databaseId --jq length)
          if [ "$verts" = "0" ]; then
            echo "::error::Aucun run CI réussi sur $DEPLOY_SHA : pas de déploiement."
            exit 1
          fi

      # Deux CI peuvent finir dans le désordre : on ne déploie le commit testé que s'il est
      # encore la pointe de main. Sinon, le commit suivant sera déployé après sa propre CI,
      # et le Pi ne recule jamais. Le job reste vert : rien n'a échoué.
      - name: Vérifier que ce commit est encore la pointe de main
        id: pointe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pointe=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$pointe" = "$DEPLOY_SHA" ]; then
            echo "deployer=true" >> "$GITHUB_OUTPUT"
          else
            echo "main a avancé depuis $DEPLOY_SHA : rien à déployer ici."
            echo "deployer=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: verifier      # le déploiement n'a lieu que sur un commit vert, pointe de main
    if: needs.verifier.outputs.deployer == 'true'
    runs-on: ubuntu-latest
    # Les secrets passent par env: et ne sont jamais interpolés dans les scripts (24/09) :
    # une valeur interpolée devient du code shell, une variable reste une donnée.
    steps:
      # Clés d'hôte du Pi lues dans le secret SSH_KNOWN_HOSTS (alias pi-gotyeah), plus de
      # scan de clés au déploiement (24/09) : un scan croit la première clé venue, et
      # des clés écrites en clair dans ce dépôt public mèneraient à l'IP du Pi via Censys
      # ou Shodan. Sans le secret, on s'arrête plutôt que de se connecter à l'aveugle.
      # Plus de checkout ici depuis le 25/09/2026 : le Pi lit le commit dans sa copie du dépôt.
      - name: Préparer la clé SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KNOWN_HOSTS" ]; then echo "::error::Secret SSH_KNOWN_HOSTS absent : sans lui, le déploiement accepterait n'importe quel hôte."; exit 1; fi
          if [ -z "$SSH_KEY" ]; then echo "::error::Secret SSH_KEY absent."; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts_pi

      # Une seule session depuis le 25/09/2026, au lieu de trois (rsync du code, construction
      # et relance, sonde /healthz) : ces étapes, inchangées, vivent dans deploy/pi-deploy.sh,
      # que le Pi lit dans le commit envoyé, et leur sortie remonte ici. La commande forcée
      # n'accepte que « deploy <sha> » : elle déploie ce commit s'il est encore la pointe de
      # main, sinon elle répond « main a avancé… » et le job reste vert, comme l'étape
      # « pointe » du job verifier. Aucune variable d'environnement ne passe au Pi.
      - name: Déployer sur le Pi
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then echo "::error::Secret SSH_HOST ou SSH_USER absent."; exit 1; fi
          ssh -i ~/.ssh/id_ed25519 -p 22 -o IdentitiesOnly=yes \
            -o HostKeyAlias=pi-gotyeah -o UserKnownHostsFile=~/.ssh/known_hosts_pi -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "deploy $DEPLOY_SHA"
