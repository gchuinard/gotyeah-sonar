name: Nightly integration tests

# Tests d'INTÉGRATION réseau (badssl.com) : ils touchent de vraies cibles, donc on ne les met
# PAS dans le gate de déploiement (ci.yml, dont deploy.yml attend le succès depuis le 25/09/2026 ;
# avant, deploy.yml rejouait lui-même les tests), à cause de la flakiness réseau. On les lance
# chaque nuit pour détecter une régression réelle (cert cassé qui avorte le scan, verify-failed muet…).

on:
  schedule:
    - cron: "0 3 * * *"     # tous les jours ~03:00 UTC
  workflow_dispatch:         # bouton « Run workflow » pour lancer à la main

jobs:
  integration:
    # Image figée, comme l'était le job de test de deploy.yml (retiré le 25/09/2026) : dépendances
    # installées dans le Python du système (3.12 sur Ubuntu 24.04), qu'ubuntu-latest changerait
    # le 19/10/2026 (Ubuntu 26).
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
      - name: Installer les dépendances
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r requirements-dev.txt
      - name: Tests d'intégration réels (réseau)
        env:
          SONAR_INTEGRATION: "1"
        run: python3 -m pytest -m integration -v
