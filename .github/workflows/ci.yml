name: CI

# Qualité sur CHAQUE push et CHAQUE pull request (le déploiement, lui, vit dans deploy.yml
# et n'a lieu que sur main). Lint, format, typage et tests BLOQUENT : la dette qu'ils
# signalaient a été résorbée le 25/09/2026 (ils étaient rouges en permanence, masqués par
# continue-on-error). Seul l'audit reste INFORMATIF : un avis publié du jour au lendemain ne
# doit pas rendre rouge un push qui n'y est pour rien. La couverture est mesurée, sans seuil :
# la version précédente de ce commentaire disait qu'elle bloquait, c'était inexact, aucun
# plancher (--cov-fail-under) n'a jamais été posé.

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6   # v6 : Node 24 (v5 tournait sous Node 20)
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Typage (mypy)
        run: mypy app.py auth.py db.py scan_jobs.py scan_compare.py scanner mcp_remote sonar_mcp

      - name: Audit des dépendances (pip-audit)
        continue-on-error: true
        run: pip-audit

      - name: Tests + couverture
        run: pytest --cov=. --cov-report=term-missing --alluredir=allure-results

      - name: Publier les résultats Allure (dashboard central)
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        # Action figée sur un commit précis et clés d'hôte du Pi passées par secret (24/09) :
        # cette version refuse de pousser sans elles, au lieu de croire la première clé vue.
        uses: gchuinard/gotyeah-allure/actions/push-allure-results@8df4d1f7f8dbc77ccc585c58b00b8cb7733c20fc
        with:
          site: gotyeah-sonar
          results-dir: allure-results
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
