<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page introuvable · Sonar</title>
<link rel="stylesheet" href="/static/fonts.css">
<style>
  :root {
    --bg:#070b10; --bg-2:#0b121a; --bg-3:#101a25;
    --line:rgba(122,160,180,.12); --line-2:rgba(122,160,180,.22);
    --text:#d6e2ea; --text-dim:#7d8c98; --text-faint:#46535d; --accent:#2ee6a6;
    --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif;
    --display:'Chakra Petch',var(--sans);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    background-image:
      radial-gradient(900px 500px at 80% -10%, rgba(46,230,166,.07), transparent 60%),
      radial-gradient(700px 500px at 0% 0%, rgba(91,141,239,.06), transparent 55%);
  }
  .card {
    width:min(420px,92vw); background:var(--bg-2); border:1px solid var(--line-2);
    border-radius:14px; padding:30px 26px; box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:6px; color:var(--text); text-decoration:none; }
  .mark { width:30px; height:30px; color:var(--accent); }
  .mark circle { fill:none; stroke:currentColor; }
  .brand b { font-family:var(--display); font-weight:700; font-size:18px; letter-spacing:.22em; text-transform:uppercase; }
  .sub { font-family:var(--mono); font-size:12px; color:var(--text-dim); margin:0 0 22px; }
  .code { font-family:var(--mono); font-size:12px; color:var(--accent); letter-spacing:.12em; margin:0 0 8px; }
  h1 { font-family:var(--display); font-weight:600; font-size:22px; letter-spacing:.04em; margin:0 0 12px; }
  p.lead { color:var(--text-dim); font-size:14px; line-height:1.6; margin:0 0 22px; }
  a.btn, a.btnlink {
    display:block; text-decoration:none; text-align:center; font-family:var(--display); font-weight:600;
    letter-spacing:.08em; text-transform:uppercase; font-size:12px; border-radius:9px; padding:13px;
    transition:filter .15s,border-color .15s;
  }
  a.btn { color:var(--bg); background:var(--accent); border:1px solid var(--accent); }
  a.btn:hover { filter:brightness(1.08); }
  a.btnlink { color:var(--text); background:var(--bg-3); border:1px solid var(--line-2); margin-top:10px; }
  a.btnlink:hover { filter:brightness(1.12); border-color:var(--accent); }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .foot { margin-top:18px; font-family:var(--mono); font-size:12px; color:var(--text-dim); line-height:1.5; }
</style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/" aria-label="Sonar, accueil">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
        <circle cx="20" cy="20" r="17" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="11" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="5" stroke-width="1.5"/>
        <line x1="20" y1="20" x2="35" y2="9" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <b>Sonar</b>
    </a>
    <p class="sub">scanner de sécurité web</p>

    <p class="code">ERREUR 404</p>
    <h1>Page introuvable</h1>
    <p class="lead">Le balayage n'a rien trouvé à cette adresse. Le lien est peut-être
      incomplet, ou la page a été déplacée.</p>

    <a class="btn" href="/">Retour à l'accueil</a>
    <a class="btnlink" href="/login">Page de connexion</a>

    <p class="foot">Un rapport de scan se retrouve depuis l'historique du tableau de bord.</p>
  </main>
</body>
</html>
